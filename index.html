<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<title>Epic 3D Hero Opener — Production</title>

<!-- Preconnect for faster font + script loads -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

<!-- Three.js r164 (ESM via importmap) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
  }
}
</script>

<style>
/* =========================================================
   1. DESIGN TOKENS
========================================================= */
:root {
  --bg: #0a0a0c;
  --accent: #22d3ee;
  --accent-2: #ffcc00;
  --text: #f5f5f5;
  --hud-stroke: #ffffff;
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

#webgl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
}

/* =========================================================
   2. HUD
========================================================= */
.hud {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  will-change: transform;
}

.bracket {
  position: absolute;
  width: 56px;
  height: 56px;
  border: 2px solid var(--hud-stroke);
  opacity: 0;
  will-change: transform, opacity;
}
.bracket.tl { top: 6%; left: 4%; border-right: none; border-bottom: none; }
.bracket.tr { top: 6%; right: 4%; border-left: none; border-bottom: none; }
.bracket.bl { bottom: 6%; left: 4%; border-right: none; border-top: none; }
.bracket.br { bottom: 6%; right: 4%; border-left: none; border-top: none; }

.crosshair {
  position: absolute;
  width: 64px;
  height: 64px;
  border: 1.5px solid var(--hud-stroke);
  border-radius: 50%;
  opacity: 0;
  will-change: transform, opacity;
}
.crosshair::before,
.crosshair::after {
  content: '';
  position: absolute;
  background: var(--hud-stroke);
}
.crosshair::before { width: 1.5px; height: 140%; left: 50%; top: -20%; }
.crosshair::after  { height: 1.5px; width: 140%; top: 50%; left: -20%; }
.crosshair.c1 { top: 22%; left: 14%; }
.crosshair.c2 { bottom: 26%; right: 18%; }

.hline,
.vline {
  position: absolute;
  background: var(--hud-stroke);
  opacity: 0;
  transform-origin: left center;
  will-change: transform, opacity;
}
.hline { height: 1px; width: 34%; top: 32%; left: 0; }
.hline.second { top: 68%; left: auto; right: 0; transform-origin: right center; }
.vline { width: 1px; height: 34%; bottom: 0; right: 30%; transform-origin: bottom center; }

.coord {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 1.2px;
  color: var(--hud-stroke);
  border-left: 2px solid var(--accent);
  padding-left: 10px;
  opacity: 0;
  line-height: 1.5;
  will-change: transform, opacity;
}
.coord.top { top: 26%; right: 8%; text-align: left; }
.coord.bottom { bottom: 14%; left: 6%; }
.coord .label { color: var(--accent); }

.data-stream {
  position: absolute;
  right: 8%;
  top: 18%;
  width: 180px;
  height: 340px;
  overflow: hidden;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--hud-stroke);
  opacity: 0;
  mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
  -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
}
.data-stream .line { margin-bottom: 6px; opacity: 0.75; white-space: nowrap; }

.glass-frame {
  position: absolute;
  inset: 8%;
  z-index: 8;
  pointer-events: none;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  box-shadow: inset 0 0 120px rgba(34, 211, 238, 0.06);
  opacity: 0;
}

.ribbon {
  position: absolute;
  left: -10%;
  top: calc(50% - 42px);
  height: 84px;
  width: 0;
  background: var(--accent);
  z-index: 5;
  opacity: 0;
  transform: rotate(-3deg);
  will-change: width, opacity;
}

.flare {
  position: absolute;
  width: 680px;
  height: 220px;
  top: 40%;
  left: -40%;
  background: radial-gradient(ellipse at center,
    rgba(255,255,255,0.95) 0%,
    rgba(34,211,238,0.35) 25%,
    rgba(255,255,255,0) 70%);
  transform: rotate(-15deg);
  mix-blend-mode: screen;
  z-index: 25;
  opacity: 0;
  pointer-events: none;
  will-change: left, opacity;
}

/* =========================================================
   3. TITLE
========================================================= */
.hero-title-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-2deg);
  z-index: 20;
  text-align: center;
  pointer-events: none;
  width: 90%;
  max-width: 1400px;
}
.hero-title {
  font-size: clamp(48px, 9vw, 150px);
  font-weight: 900;
  line-height: 0.92;
  letter-spacing: -0.04em;
  text-transform: uppercase;
  color: var(--text);
  text-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
  margin: 0;
  word-break: break-word;
}
.hero-title .char {
  display: inline-block;
  opacity: 0;
  transform: translateY(120%);
  will-change: transform, opacity;
}
.hero-sub {
  margin-top: 18px;
  font-size: 14px;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0;
  transform: translateY(20px);
  font-weight: 600;
}

/* =========================================================
   4. LOADER
========================================================= */
#loader {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  transition: opacity 0.6s ease;
}
#loader.hidden { opacity: 0; pointer-events: none; }
#loader .spinner {
  width: 48px;
  height: 48px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
#loader .label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* =========================================================
   5. MOBILE
========================================================= */
@media (max-width: 768px) {
  .data-stream { display: none; }
  .coord.top { top: 16%; right: 6%; font-size: 10px; }
  .coord.bottom { bottom: 10%; left: 6%; font-size: 10px; }
  .bracket { width: 40px; height: 40px; }
  .crosshair { width: 48px; height: 48px; }
  .hero-sub { font-size: 11px; letter-spacing: 0.3em; }
  .hline { width: 24%; }
  .vline { height: 24%; }
}
</style>
</head>

<body>

<div id="loader">
  <div class="spinner"></div>
  <div class="label">Initializing Motion Engine</div>
</div>

<div id="stage">
  <canvas id="webgl"></canvas>

  <div class="hud" id="hud">
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>

    <div class="crosshair c1"></div>
    <div class="crosshair c2"></div>

    <div class="hline"></div>
    <div class="hline second"></div>
    <div class="vline"></div>

    <div class="coord top">
      <span class="label">LAT</span> 40.7128° N<br>
      <span class="label">LON</span> 74.0060° W
    </div>
    <div class="coord bottom">
      <span class="label">SYS</span> MOTION.ENGINE // ONLINE<br>
      <span class="label">FPS</span> <span id="fps">--</span>
    </div>

    <div class="data-stream" id="data-stream"></div>

    <div class="glass-frame"></div>

    <div class="ribbon"></div>

    <div class="hero-title-wrap">
      <h1 class="hero-title" id="hero-title" aria-label="Easy to customize">
        <!-- injected by JS -->
      </h1>
      <div class="hero-sub" id="hero-sub">NO PLUGINS REQUIRED</div>
    </div>

    <div class="flare"></div>
  </div>
</div>

<script type="module">
/* =========================================================
   IMPORTS
========================================================= */
import * as THREE from 'three';
import gsap from 'gsap';

/* =========================================================
   0. CONFIG
========================================================= */
const CONFIG = {
  panelCount: 5,
  panelW: 4.2,
  panelH: 2.6,
  cameraFov: 42,
  cameraStartZ: 22,
  cameraEndZ: 20,
  pointerLerp: 0.05,
  pointerInfluenceX: 1.1,
  pointerInfluenceY: 0.8,
  pointerRotX: 0.06,
  pointerRotY: 0.10,
  dustCount: 1200,
  dotSpacing: 2.4,
  title: 'EASY TO CUSTOMIZE',
  subtitle: 'NO PLUGINS REQUIRED',
};

/* =========================================================
   1. UTILS
========================================================= */
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

/* =========================================================
   2. SCENE SETUP
========================================================= */
const canvas = document.getElementById('webgl');
const stageEl = document.getElementById('stage');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);
scene.fog = new THREE.Fog(0x0a0a0c, 18, 42);

const camera = new THREE.PerspectiveCamera(
  CONFIG.cameraFov,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);
camera.position.set(0, 0, CONFIG.cameraStartZ);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

/* =========================================================
   3. LIGHTS
========================================================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
keyLight.position.set(8, 14, 12);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x22d3ee, 0.9);
rimLight.position.set(-12, -6, -8);
scene.add(rimLight);

/* =========================================================
   4. PROCEDURAL TEXTURES (swap for real images in prod)
========================================================= */
function makeTexture(hue, id) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 512, 512);
  grad.addColorStop(0, `hsl(${hue}, 70%, 55%)`);
  grad.addColorStop(1, `hsl(${(hue + 60) % 360}, 80%, 20%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 512; i += 64) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 88px Inter, sans-serif';
  ctx.fillText(`0${id}`, 32, 470);

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* =========================================================
   5. PANELS
========================================================= */
const panels = [];

for (let i = 0; i < CONFIG.panelCount; i++) {
  const geo = new THREE.PlaneGeometry(CONFIG.panelW, CONFIG.panelH, 1, 1);
  const tex = makeTexture(190 + i * 40, i + 1);
  const mat = new THREE.MeshPhysicalMaterial({
    map: tex,
    color: 0xffffff,
    metalness: 0.15,
    roughness: 0.35,
    transmission: 0.12,
    transparent: true,
    opacity: 1,
    ior: 1.4,
    thickness: 0.6,
    clearcoat: 0.5,
    clearcoatRoughness: 0.3,
    side: THREE.DoubleSide,
  });

  const mesh = new THREE.Mesh(geo, mat);

  const col = i - (CONFIG.panelCount - 1) / 2;
  const x = col * 4.6;
  const y = Math.sin(col * 0.6) * 0.9;
  const z = -Math.abs(col) * 2.2 - 2;

  mesh.position.set(x, y, z);
  mesh.rotation.y = -col * 0.14;
  mesh.rotation.x = col * 0.03;

  mesh.userData = {
    base: mesh.position.clone(),
    baseRot: mesh.rotation.clone(),
    floatSpeed: rand(0.35, 0.7),
    floatAmp: rand(0.12, 0.25),
    phase: rand(0, Math.PI * 2),
  };

  scene.add(mesh);
  panels.push(mesh);
}

/* =========================================================
   6. BACKGROUND DOT GRID
========================================================= */
const dotGeo = new THREE.BufferGeometry();
const dp = [];
for (let x = -30; x <= 30; x += CONFIG.dotSpacing)
  for (let y = -16; y <= 16; y += CONFIG.dotSpacing)
    dp.push(x, y, -22);
dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));

const dotGrid = new THREE.Points(
  dotGeo,
  new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.06,
    transparent: true,
    opacity: 0.22,
    sizeAttenuation: true,
  })
);
scene.add(dotGrid);

/* =========================================================
   7. AMBIENT DUST
========================================================= */
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(CONFIG.dustCount * 3);
for (let i = 0; i < CONFIG.dustCount * 3; i += 3) {
  dustPos[i] = rand(-30, 30);
  dustPos[i + 1] = rand(-18, 18);
  dustPos[i + 2] = rand(-25, -4);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));

const dust = new THREE.Points(
  dustGeo,
  new THREE.PointsMaterial({
    color: 0x88eaff,
    size: 0.05,
    transparent: true,
    opacity: 0.5,
    sizeAttenuation: true,
  })
);
scene.add(dust);

/* =========================================================
   8. CAMERA PARALLAX
========================================================= */
const camBase = { x: 0, y: 0, z: CONFIG.cameraStartZ, rotX: 0, rotY: 0, rotZ: 0 };
const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
const scrollState = { t: 0 };

window.addEventListener('pointermove', (e) => {
  pointer.tx = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.ty = (e.clientY / window.innerHeight) * 2 - 1;
}, { passive: true });

window.addEventListener('scroll', () => {
  const max = Math.max(1, document.body.scrollHeight - window.innerHeight);
  scrollState.t = window.scrollY / max;
}, { passive: true });

/* =========================================================
   9. TITLE SPLIT
========================================================= */
const heroTitleEl = document.getElementById('hero-title');
const heroSubEl = document.getElementById('hero-sub');
const fpsEl = document.getElementById('fps');

function splitTitle(text) {
  heroTitleEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  [...text].forEach((ch) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    frag.appendChild(span);
  });
  heroTitleEl.appendChild(frag);
  return Array.from(heroTitleEl.querySelectorAll('.char'));
}

heroTitleEl.setAttribute('aria-label', CONFIG.title);
let titleChars = splitTitle(CONFIG.title);

/* =========================================================
   10. DATA STREAM
========================================================= */
const dataStream = document.getElementById('data-stream');
for (let i = 0; i < 18; i++) {
  const div = document.createElement('div');
  div.className = 'line';
  const hex = Math.floor(0x1000 + Math.random() * 0xefff).toString(16).toUpperCase();
  const status = Math.random() > 0.5 ? 'OK' : 'SYNC';
  div.textContent = `0x${hex} :: ${status}`;
  dataStream.appendChild(div);
}

/* =========================================================
   11. RENDER LOOP
========================================================= */
const clock = new THREE.Clock();
let fpsFrames = 0;
let fpsLast = 0;
let rafId = 0;

function tick() {
  rafId = requestAnimationFrame(tick);
  const t = clock.getElapsedTime();

  /* Pointer smoothing */
  pointer.x = lerp(pointer.x, pointer.tx, CONFIG.pointerLerp);
  pointer.y = lerp(pointer.y, pointer.ty, CONFIG.pointerLerp);

  /* Camera: base (GSAP) + pointer offset */
  camera.position.x = camBase.x + pointer.x * CONFIG.pointerInfluenceX;
  camera.position.y = camBase.y - pointer.y * CONFIG.pointerInfluenceY;
  camera.position.z = camBase.z;
  camera.rotation.x = camBase.rotX - pointer.y * CONFIG.pointerRotX + scrollState.t * 0.15;
  camera.rotation.y = camBase.rotY + pointer.x * CONFIG.pointerRotY;
  camera.rotation.z = camBase.rotZ;

  /* Panels idle float */
  for (let i = 0; i < panels.length; i++) {
    const p = panels[i];
    const ud = p.userData;
    p.position.y = ud.base.y + Math.sin(t * ud.floatSpeed + ud.phase) * ud.floatAmp;
    p.rotation.z = ud.baseRot.z + Math.sin(t * 0.4 + ud.phase) * 0.02;
  }

  /* Atmosphere */
  dust.rotation.y = t * 0.015;
  dotGrid.rotation.z = t * 0.004;

  /* FPS */
  fpsFrames++;
  if (t - fpsLast > 0.5) {
    fpsEl.textContent = String(Math.round(fpsFrames / (t - fpsLast)));
    fpsFrames = 0;
    fpsLast = t;
  }

  renderer.render(scene, camera);
}

/* =========================================================
   12. GSAP MASTER TIMELINE
========================================================= */
let masterTl;

function buildTimeline() {
  gsap.killTweensOf('*');

  /* Reset HUD */
  gsap.set('.bracket', { opacity: 0, scale: 1.6 });
  gsap.set('.crosshair', { opacity: 0, scale: 0 });
  gsap.set('.hline, .vline', { opacity: 0, scaleX: 0, scaleY: 0 });
  gsap.set('.coord', { opacity: 0, y: 20 });
  gsap.set('.data-stream', { opacity: 0, y: 40 });
  gsap.set('.glass-frame', { opacity: 0 });
  gsap.set('.ribbon', { width: 0, opacity: 0 });
  gsap.set('.flare', { left: '-40%', opacity: 0 });
  gsap.set(titleChars, { opacity: 0, yPercent: 120 });
  gsap.set(heroSubEl, { opacity: 0, y: 20 });

  /* Reset panels */
  panels.forEach((p) => {
    p.position.copy(p.userData.base);
    p.scale.set(1, 1, 1);
    p.rotation.copy(p.userData.baseRot);
    p.material.opacity = 1;
  });

  /* Reset camera base */
  Object.assign(camBase, { x: 0, y: 0, z: CONFIG.cameraStartZ, rotX: 0, rotY: 0, rotZ: 0 });

  masterTl = gsap.timeline({ defaults: { ease: 'expo.out' } });

  /* ---------- PHASE 1: 0.0s – 1.0s ---------- */
  masterTl
    .to('.bracket', { opacity: 1, scale: 1, duration: 0.8, stagger: 0.08 }, 0)
    .to('.hline', { opacity: 1, scaleX: 1, duration: 1.0, ease: 'expo.inOut' }, 0.15)
    .to('.vline', { opacity: 1, scaleY: 1, duration: 1.0, ease: 'expo.inOut' }, 0.25)
    .to('.crosshair', { opacity: 1, scale: 1, duration: 0.7, stagger: 0.2, ease: 'back.out(1.6)' }, 0.4)
    .to('.coord', { opacity: 1, y: 0, duration: 0.7, stagger: 0.12 }, 0.5)
    .to('.data-stream', { opacity: 1, y: 0, duration: 0.6 }, 0.6)
    .to('.glass-frame', { opacity: 1, duration: 1.0 }, 0.2)
    .to('.ribbon', { width: '130%', opacity: 1, duration: 0.9, ease: 'power2.out' }, 0.2);

  masterTl
    .to(panels[2].position, { z: 8, duration: 1.0, ease: 'power2.out' }, 0)
    .to(panels[2].rotation, { x: 0, y: 0, duration: 1.0, ease: 'power2.out' }, 0);

  /* ---------- PHASE 2: 1.0s – 3.0s ---------- */
  masterTl
    .to(panels[0].position, { x: -16, z: -4, duration: 1.8, ease: 'power2.inOut' }, 1.0)
    .to(panels[4].position, { x: 16, z: -4, duration: 1.8, ease: 'power2.inOut' }, 1.0)
    .to(panels[0].rotation, { y: 0.4, duration: 1.8, ease: 'power2.inOut' }, 1.0)
    .to(panels[4].rotation, { y: -0.4, duration: 1.8, ease: 'power2.inOut' }, 1.0)
    .to(panels[1].position, { x: -8, z: 2, y: 0.3, duration: 1.8, ease: 'power2.inOut' }, 1.0)
    .to(panels[3].position, { x: 8, z: 2, y: 0.3, duration: 1.8, ease: 'power2.inOut' }, 1.0)
    .to(panels[1].scale, { x: 0.85, y: 0.85, z: 1, duration: 1.8, ease: 'power2.inOut' }, 1.0)
    .to(panels[3].scale, { x: 0.85, y: 0.85, z: 1, duration: 1.8, ease: 'power2.inOut' }, 1.0)
    .to(panels[1].material, { opacity: 0.35, duration: 1.4, ease: 'power2.inOut' }, 1.2)
    .to(panels[3].material, { opacity: 0.35, duration: 1.4, ease: 'power2.inOut' }, 1.2)
    .to(panels[2].position, { z: 3, duration: 1.8, ease: 'power2.inOut' }, 1.0)
    .to(panels[2].scale, { x: 0.9, y: 0.9, z: 1, duration: 1.8, ease: 'power2.inOut' }, 1.0)
    .to(camBase, { z: 17, rotX: 0.05, duration: 2.0, ease: 'power2.inOut' }, 1.0);

  /* ---------- PHASE 3: 3.0s – 5.0s ---------- */
  masterTl
    .to(camBase, { z: CONFIG.cameraEndZ, x: -0.6, rotY: -0.12, rotX: 0.03, duration: 2.0, ease: 'power3.inOut' }, 3.0)
    .to(titleChars, {
      opacity: 1,
      yPercent: 0,
      duration: 0.9,
      ease: 'back.out(1.7)',
      stagger: { each: 0.035, from: 'start' },
    }, 3.0)
    .to(heroSubEl, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 3.8)
    .to('.flare', { left: '130%', opacity: 1, duration: 1.4, ease: 'power2.inOut' }, 3.2)
    .to('.flare', { opacity: 0, duration: 0.6, ease: 'power2.in' }, 4.4)

    .to(panels[0].position, { x: -14, z: -2, duration: 1.8, ease: 'power2.inOut' }, 3.0)
    .to(panels[4].position, { x: 14, z: -2, duration: 1.8, ease: 'power2.inOut' }, 3.0)
    .to(panels[0].rotation, { y: -0.28, duration: 1.8 }, 3.0)
    .to(panels[4].rotation, { y: 0.28, duration: 1.8 }, 3.0)
    .to(panels[1].material, { opacity: 0.7, duration: 1.5 }, 3.0)
    .to(panels[3].material, { opacity: 0.7, duration: 1.5 }, 3.0)
    .to(panels[1].scale, { x: 1, y: 1, z: 1, duration: 1.5, ease: 'power2.inOut' }, 3.0)
    .to(panels[3].scale, { x: 1, y: 1, z: 1, duration: 1.5, ease: 'power2.inOut' }, 3.0)
    .to(panels[2].scale, { x: 1, y: 1, z: 1, duration: 1.5 }, 3.0);

  return masterTl;
}

/* =========================================================
   13. RESIZE
========================================================= */
let resizeRaf = 0;
function onResize() {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  });
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

/* =========================================================
   14. VISIBILITY (pause when tab hidden)
========================================================= */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(rafId);
    masterTl?.pause();
  } else {
    clock.getDelta(); // reset delta
    tick();
    masterTl?.play();
  }
});

/* =========================================================
   15. BOOT
========================================================= */
function boot() {
  tick();
  buildTimeline();

  /* Fade out loader */
  const loader = document.getElementById('loader');
  setTimeout(() => {
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 700);
  }, 200);

  /* Play after loader fades */
  setTimeout(() => {
    masterTl.play(0);
  }, 400);
}

/* Wait for fonts so char widths are correct */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(boot);
} else {
  window.addEventListener('load', boot);
}

/* =========================================================
   16. PUBLIC API (for Next.js / host integration)
========================================================= */
window.HeroEngine = {
  replay() {
    buildTimeline();
    masterTl.play(0);
  },
  setTitle(title, subtitle) {
    CONFIG.title = title;
    CONFIG.subtitle = subtitle || CONFIG.subtitle;
    heroTitleEl.setAttribute('aria-label', title);
    titleChars = splitTitle(title);
    if (subtitle) heroSubEl.textContent = subtitle;
    buildTimeline();
    masterTl.play(0);
  },
  destroy() {
    cancelAnimationFrame(rafId);
    masterTl?.kill();
    panels.forEach((p) => {
      p.geometry.dispose();
      p.material.map?.dispose();
      p.material.dispose();
    });
    dotGeo.dispose();
    dustGeo.dispose();
    renderer.dispose();
  },
};
</script>
