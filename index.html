<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Hero Intro Opener (1080p · Cinematic)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=JetBrains+Mono:wght@300;400&family=Montserrat:wght@900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>
:root{--bg-app:#0f0f11;--bg-panel:#1a1a1d;--bg-input:#000;--accent:#FFCC00;--text-main:#fff;--text-muted:#888;--border:#333;--radius:8px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg-app);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;height:100vh;height:100dvh;overflow:hidden;flex-direction:row}
#sidebar{width:340px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px;gap:12px;overflow-y:auto;z-index:1000;flex-shrink:0}
.panel-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px}
h2{margin:0;font-size:18px;color:var(--accent);letter-spacing:.5px}
h3{font-size:11px;margin:8px 0 4px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.control-group{display:flex;flex-direction:column;gap:5px}
label{font-size:13px;color:#ccc}
input[type=text],select{width:100%;padding:10px;background:var(--bg-input);border:1px solid var(--border);color:#fff;border-radius:var(--radius);font-size:14px;transition:border .2s}
input[type=text]:focus,select:focus{border-color:var(--accent);outline:none}
input[type=file]{font-size:12px;color:#ccc;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.color-row{display:flex;gap:10px}
.color-swatch{flex:1;display:flex;flex-direction:column;gap:4px}
input[type=color]{width:100%;height:40px;padding:2px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
button{background:var(--accent);color:#000;border:none;padding:14px;font-weight:800;font-size:14px;border-radius:var(--radius);cursor:pointer;transition:transform .1s,opacity .2s;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:center;align-items:center;gap:8px}
button:hover{opacity:.9}button:active{transform:scale(.98)}
button:disabled{background:#444;color:#888;cursor:not-allowed;transform:none}
.btn-export{background:#fff}
.btn-small{padding:8px;font-size:11px;background:#333;color:#fff}
.button-group{display:flex;gap:10px;margin-top:6px}
.button-group button{flex:1}
#preview-container{flex:1;display:flex;justify-content:center;align-items:center;background:#000;overflow:hidden;position:relative}
#canvas-wrapper{width:1920px;height:1080px;position:absolute;transform-origin:center center}
#app-canvas{width:1920px;height:1080px;background:#0a0a0e;position:relative;overflow:hidden}
#webgl-canvas,#overlay-canvas{position:absolute;top:0;left:0;width:1920px;height:1080px}
#overlay-canvas{z-index:10;pointer-events:none}
@media (max-width:1024px){
 body{flex-direction:column}
 #preview-container{height:45vh;border-bottom:1px solid var(--border);flex-shrink:0;flex:none}
 #sidebar{width:100%;height:55vh;border-right:none;border-top:1px solid var(--border);padding:15px}
}
@media (max-width:1024px) and (orientation:landscape){
 body{flex-direction:row}
 #preview-container{height:100vh;flex:1;border-bottom:none}
 #sidebar{width:300px;height:100vh}
}
#recording-overlay{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,50,50,.95);color:#fff;padding:12px 24px;border-radius:30px;font-weight:700;display:none;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.5);animation:pulse 1.5s infinite;white-space:nowrap}
@keyframes pulse{0%{opacity:1}50%{opacity:.7}100%{opacity:1}}
</style>
</head>
<body>

<div id="preview-container">
  <div id="canvas-wrapper">
    <div id="app-canvas">
      <canvas id="webgl-canvas" width="1920" height="1080"></canvas>
      <canvas id="overlay-canvas" width="1920" height="1080"></canvas>
    </div>
  </div>
</div>

<div id="sidebar">
  <div class="panel-header"><h2>3D Hero Intro · AE Style</h2></div>

  <div class="control-group">
    <h3>Headline</h3>
    <input type="text" id="input-text" value="MAXING & TRANSACTIONS">
    <select id="input-font">
      <option value='"Montserrat", Arial, sans-serif'>Montserrat Black</option>
      <option value='"Anton", Impact, sans-serif'>Anton</option>
      <option value='"Bebas Neue", Impact, sans-serif'>Bebas Neue</option>
      <option value='"Space Grotesk", Arial, sans-serif'>Space Grotesk</option>
      <option value='"Arial Black", Arial, sans-serif'>Arial Black</option>
      <option value='Impact, sans-serif'>Impact</option>
    </select>
  </div>

  <div class="control-group">
    <h3>Taglines</h3>
    <input type="text" id="input-tag1" value="EASY TO CUSTOMIZE">

  <div class="control-group">
    <h3>Brand Colors</h3>

      <div class="color-swatch"><label>Accent (tints planes)</label><input type="color" id="input-color-accent" value="#FFCC00"></div>

  <div class="control-group">

      <option value="1">Normal (1x)</option>

  <div class="button-group">
    <button id="btn-preview">▶ Play Preview</button>
    <button id="btn-export" class="btn-export">⬇ Export 1080p</button>
  </div>
</div>

<div id="recording-overlay">🔴 RENDERING…</div>

<script>
// ============================================================
// CONSTANTS & MATH HELPERS
// ============================================================
const W = 1920, H = 1080;
const BG = '#0a0a0e';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = t => t * t * (3 - 2 * t);
const expoOut = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const pad2 = n => String(Math.floor(n)).padStart(2, '0');
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// After Effects style eases
const aeEaseInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;   // cubic in-out
const aeEaseOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const aeEaseInExpo = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const aeEaseOutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const aeEaseInOutExpo = p => p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2;
const aeEaseInOutQuint = p => p < 0.5 ? 16 * p * p * p * p * p : 1 - Math.pow(-2 * p + 2, 5) / 2;
const aeEaseOutElastic = p => {
  const c4 = (2 * Math.PI) / 3;
  return p === 0 ? 0 : p === 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * c4) + 1;
};

// ============================================================
// RESPONSIVE PREVIEW SCALING
// ============================================================
function resizeCanvas() {
  const wrapper = document.getElementById('canvas-wrapper');
  const container = document.getElementById('preview-container');
  const scale = Math.min(container.clientWidth / W, container.clientHeight / H) * 0.95;
  wrapper.style.transform = `scale(${scale})`;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));

// ============================================================
// CONFIG + ANIMATION STATE
// ============================================================
const cfg = {
  text: 'MAXING & TRANSACTIONS',
  tag1: 'EASY TO CUSTOMIZE',
  tag2: 'NO PLUGINS REQUIRED',
  font: '"Montserrat", Arial, sans-serif',
  accent: '#FFCC00',
  ink: '#FFFFFF',
  speed: 1,
  fx: 1,
  logo: null
};
const MONO = '"JetBrains Mono", "SF Mono", Menlo, monospace';

const S = { fr: 0, clk: 0 };
function resetState() {
  Object.assign(S, {
    intro: 0,               // slice mask
    hudP: 0, hudO: 1,
    hs: 0.8, heroO: 0, outerO: 0,
    tiltX: 0, tiltY: 0,
    split: 0, sw2: 0, prog: 0, par: 0,
    ab: 0.005,
    tr: 0, ts: 1,
    t1o: 0, t2o: 0, t2ls: 0.05,
    sl: 0, flash: 0, glow: 0,
    // NEW After Effects-style parameters
    motionBlur: 0,          // 0-1, simulates shutter blur
    rgbSplit: 0,            // extra RGB separation during whip transitions
    burn: 0,                // film burn
    whip: 0,                // horizontal whip pan amount
    whipDir: 1,
    scanLine: 0,            // CRT scan line sweep
    headGlitch: 0,          // glitch offset for headline
    heroSquash: 1,          // squeeze/squash on hero plane
    dustBurst: 0,           // dust particle burst
    gridPulse: 0,           // HUD grid pulse
    letterBounce: 0,        // bounce for tagline
    lightSweep: 0,          // light sweep across headline
    depthFog: 0,            // extra depth fog on far layers
    ringPulse: 0,           // expanding ring at climax
    offsetShake: 0          // camera shake
  });
}
resetState();

// ============================================================
// PROCEDURAL TEXTURES
// ============================================================
function hexHue(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (!d) return 40;
  let h;
  if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
  return (h * 60 + 360) % 360;
}

function paintTexture(cv, hue, seed) {
  const x = cv.getContext('2d'), w = cv.width, h = cv.height;
  const r = k => rnd(seed * 97 + k);
  let g = x.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, `hsl(${hue},65%,10%)`);
  g.addColorStop(1, `hsl(${hue + 30},75%,36%)`);
  x.fillStyle = g; x.fillRect(0, 0, w, h);

  for (let b = 0; b < 8; b++) {
    const cx = r(b) * w, cy = r(b + 20) * h * 0.8, rad = 120 + r(b + 40) * 380;
    const h2 = hue + r(b + 60) * 70 - 20;
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    rg.addColorStop(0, `hsla(${h2},90%,55%,0.55)`);
    rg.addColorStop(1, `hsla(${h2},90%,55%,0)`);
    x.fillStyle = rg; x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }

  let bx = 0, bi = 0;
  while (bx < w) {
    const bw = 40 + r(100 + bi) * 90, bh = 60 + r(200 + bi) * h * 0.42;
    x.fillStyle = `hsl(${hue},45%,${4 + r(300 + bi) * 5}%)`;
    x.fillRect(bx, h - bh, bw, bh);
    const wins = Math.floor(bw * bh / 500);
    for (let k = 0; k < wins; k++) {
      x.fillStyle = `hsla(${hue + 40},100%,70%,${0.3 + r(400 + bi * 50 + k) * 0.5})`;
      x.fillRect(bx + 4 + r(500 + bi * 50 + k) * (bw - 8), h - bh + 6 + r(600 + bi * 50 + k) * (bh - 12), 3, 4);
    }
    bx += bw + 4 + r(700 + bi) * 12; bi++;
  }

  for (let s = 0; s < 9; s++) {
    x.strokeStyle = `rgba(255,255,255,${0.1 + r(800 + s) * 0.2})`;
    x.lineWidth = 1 + r(820 + s) * 4;
    x.beginPath(); x.moveTo(r(840 + s) * w, 0); x.lineTo(r(840 + s) * w - 300, h); x.stroke();
  }

  const og = x.createRadialGradient(w * 0.7, h * 0.3, 0, w * 0.7, h * 0.3, 130);
  og.addColorStop(0, `hsla(${hue + 20},100%,78%,0.95)`);
  og.addColorStop(1, `hsla(${hue + 20},100%,78%,0)`);
  x.fillStyle = og; x.fillRect(w * 0.7 - 130, h * 0.3 - 130, 260, 260);

  const vg = x.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, w * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  x.fillStyle = vg; x.fillRect(0, 0, w, h);
}

const HUE_OFFSETS = [0, 170, 215, 40, 285, 330];
const texCanvases = HUE_OFFSETS.map(() => { const c = document.createElement('canvas'); c.width = 1024; c.height = 576; return c; });
function paintAllTextures() {
  const base = hexHue(cfg.accent);
  texCanvases.forEach((cv, i) => paintTexture(cv, base + HUE_OFFSETS[i], i + 1));
}
paintAllTextures();
const textures = texCanvases.map(cv => {
  const t = new THREE.CanvasTexture(cv);
  t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = false;
  return t;
});

// ============================================================
// THREE.JS SCENE
// ============================================================
const webglCanvas = document.getElementById('webgl-canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W / H, 1, 5000);
camera.position.set(0, 0, 1000);

const renderer = new THREE.WebGLRenderer({ canvas: webglCanvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0);

const VERT = `
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

// Advanced fragment shader with motion blur simulation + whip + extra depth
const FRAG = `
uniform sampler2D uTexA;
uniform sampler2D uTexB;
uniform float uProgress;
uniform float uAberration;
uniform float uBlur;
uniform float uOpacity;
uniform float uOffset;
uniform float uDim;
uniform float uMotionBlur;
uniform float uWhip;
uniform float uWhipDir;
uniform float uDepthFog;
uniform float uTime;
varying vec2 vUv;

vec3 mixTex(vec2 uv){
  float p = clamp(uProgress * 1.5 - uOffset * 0.5 - uv.x * 0.5, 0.0, 1.0);
  p = smoothstep(0.0, 1.0, p);
  return mix(texture2D(uTexA, uv).rgb, texture2D(uTexB, uv).rgb, p);
}
vec3 sampleCA(vec2 uv){
  vec2 dir = uv - 0.5;
  float r = mixTex(uv + dir * uAberration).r;
  float g = mixTex(uv).g;
  float b = mixTex(uv - dir * uAberration).b;
  return vec3(r, g, b);
}
void main(){
  // Motion blur simulation via directional multi-tap
  vec3 col;
  if (uMotionBlur > 0.01) {
    float mblur = uMotionBlur * 0.02;
    vec3 sum = vec3(0.0); float tot = 0.0;
    for (int i = -4; i <= 4; i++) {
      float t = float(i) / 4.0;
      float w = 1.0 - abs(t) * 0.6;
      vec2 uv2 = vUv + vec2(uWhip * uWhipDir * mblur * 8.0 * t, 0.0);
      sum += sampleCA(uv2) * w;
      tot += w;
    }
    col = sum / tot;
  } else if (uBlur > 0.01) {
    float rad = uBlur * 0.006;
    vec3 sum = vec3(0.0); float tot = 0.0;
    for (int x = -1; x <= 1; x++) {
      for (int y = -1; y <= 1; y++) {
        float w = (x == 0 && y == 0) ? 4.0 : ((x == 0 || y == 0) ? 2.0 : 1.0);
        sum += sampleCA(vUv + vec2(float(x), float(y)) * rad) * w;
        tot += w;
      }
    }
    col = sum / tot;
  } else {
    col = sampleCA(vUv);
  }

  // Whip pan shearing
  if (abs(uWhip) > 0.01) {
    float shear = uWhip * uWhipDir * (vUv.y - 0.5) * 0.06;
    vec2 uv3 = vUv + vec2(shear, 0.0);
    col = mix(col, sampleCA(uv3), abs(uWhip) * 0.7);
  }

  // Depth fog for far layers
  col = mix(col, vec3(0.04, 0.04, 0.06), uDepthFog);

  // Glassmorphic border
  vec2 e = min(vUv, 1.0 - vUv);
  float ed = min(e.x / 0.0045, e.y / 0.008);
  float border = 1.0 - smoothstep(0.85, 1.15, ed);
  float diag = vUv.x * 0.7 + (1.0 - vUv.y) * 0.3;
  float refl = smoothstep(0.55, 0.75, diag) * (1.0 - smoothstep(0.75, 0.95, diag)) * 0.12;
  float glow = (1.0 - smoothstep(0.0, 6.0, ed)) * 0.08;
  col = mix(col, vec3(1.0), border * 0.6) + refl + glow;

  // Subtle animated scanline sheen
  float scan = sin(vUv.y * 400.0 + uTime * 3.0) * 0.008;
  col += scan;

  col *= uDim;
  gl_FragColor = vec4(col, uOpacity);
}`;

const PLANE_SCALE = 36;
const LAYER_Z = [0, -150, -300, -450, -600];
const planes = [];
let planeIdx = 0;
function addPlane(L, x, y, hero) {
  const mat = new THREE.ShaderMaterial({
    vertexShader: VERT, fragmentShader: FRAG, transparent: true, depthWrite: false,
    uniforms: {
      uTexA: { value: textures[planeIdx % 6] },
      uTexB: { value: textures[(planeIdx + 3) % 6] },
      uProgress: { value: 0 },
      uAberration: { value: 0.005 },
      uBlur: { value: L >= 3 ? (L === 3 ? 0.8 : 1.2) : 0 },
      uOpacity: { value: 0 },
      uOffset: { value: rnd(planeIdx + 7) },
      uDim: { value: 1 - L * 0.1 },
      uMotionBlur: { value: 0 },
      uWhip: { value: 0 },
      uWhipDir: { value: 1 },
      uDepthFog: { value: 0 },
      uTime: { value: 0 }
    }
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(16, 9), mat);
  mesh.renderOrder = hero ? 20 : 10 - L;
  mesh.userData = { L, hero, baseX: x, baseY: y, baseZ: LAYER_Z[L], side: x >= 0 ? 1 : -1 };
  mesh.position.set(x, y, LAYER_Z[L]);
  scene.add(mesh);
  planes.push(mesh);
  planeIdx++;
}
addPlane(0, 0, 0, true);
[[-640, 230], [640, -230], [-700, -260], [700, 260]].forEach(p => addPlane(0, p[0], p[1], false));
for (let L = 1; L < 5; L++) {
  const n = 4 + (L % 3);
  const spread = (700 + Math.abs(LAYER_Z[L])) / 700;
  for (let k = 0; k < n; k++) {
    const x = ((k - (n - 1) / 2) * 560 + (L % 2 ? 130 : -130)) * spread;
    const y = (k % 2 ? 1 : -1) * 260 * spread + (L % 2 ? 50 : -50);
    addPlane(L, x, y, false);
  }
}

// Dust particles
const dustCount = 1200;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
const dustSeed = new Float32Array(dustCount);
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3] = (rnd(i + 1) - 0.5) * 2600;
  dustPos[i * 3 + 1] = (rnd(i + 2000) - 0.5) * 1500;
  dustPos[i * 3 + 2] = -800 + rnd(i + 4000) * 1200;
  dustSeed[i] = rnd(i + 6000);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: 0xffffff, size: 3, transparent: true, opacity: 0.45 });
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

// ============================================================
// 2D OVERLAY (HUD + TYPOGRAPHY + FX)
// ============================================================
const overlay = document.getElementById('overlay-canvas');
const octx = overlay.getContext('2d');
let vignetteGrad = null;

function strokeProgress(c, path, total, p) {
  if (p <= 0) return;
  c.setLineDash([total, total]);
  c.lineDashOffset = total * (1 - clamp(p, 0, 1));
  c.stroke(path);
  c.setLineDash([]);
}

function drawTracked(c, str, cx, y, size, trackEm, fontFamily, weight) {
  const chars = Array.from(str);
  c.font = `${weight} ${size}px ${fontFamily}`;
  const track = trackEm * size;
  const ws = chars.map(ch => c.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + track * Math.max(0, chars.length - 1);
  let x = cx - total / 2;
  c.textAlign = 'left'; c.textBaseline = 'middle';
  chars.forEach((ch, i) => { c.fillText(ch, x, y); x += ws[i] + track; });
  return total;
}

function drawHUD(c) {
  if (S.hudP <= 0.001) return;
  const ink = cfg.ink, acc = cfg.accent;
  const inset = 24, L = 70;
  c.save();
  c.globalAlpha = S.hudO;
  c.lineWidth = 2; c.strokeStyle = ink;

  const corners = [[1, 1], [-1, 1], [1, -1], [-1, -1]];
  corners.forEach(([sx, sy]) => {
    const x0 = sx === 1 ? inset : W - inset, y0 = sy === 1 ? inset : H - inset;
    const p = new Path2D();
    p.moveTo(x0 + sx * L, y0); p.lineTo(x0, y0); p.lineTo(x0, y0 + sy * L);
    strokeProgress(c, p, L * 2, S.hudP);
    if (S.hudP > 0.9) {
      const gl = 4 + S.gridPulse * 6;
      c.fillStyle = acc;
      c.fillRect(x0 - 3, y0 - 3, 6, 6);
      c.globalAlpha = S.hudO * (0.3 + S.gridPulse * 0.7);
      c.fillRect(x0 - gl / 2, y0 - gl / 2, gl, gl);
      c.globalAlpha = S.hudO;
    }
  });

  // Grid with pulse
  c.lineWidth = 1;
  const gridAlpha = 0.15 + S.gridPulse * 0.25;
  c.strokeStyle = `rgba(255,255,255,${gridAlpha})`;
  [[W / 3, 0, W / 3, H, H], [2 * W / 3, 0, 2 * W / 3, H, H], [0, H / 3, W, H / 3, W], [0, 2 * H / 3, W, 2 * H / 3, W]].forEach((l, i) => {
    const p = new Path2D(); p.moveTo(l[0], l[1]); p.lineTo(l[2], l[3]);
    strokeProgress(c, p, l[4], clamp(S.hudP * 1.4 - i * 0.2, 0, 1));
  });

  c.strokeStyle = ink; c.lineWidth = 1;
  const step = 30, count = Math.floor(W / step), vis = Math.floor(clamp(S.hudP, 0, 1) * count);
  c.beginPath();
  for (let i = 0; i <= vis; i++) {
    const x = i * step + 0.5, len = i % 5 === 0 ? 12 : 5;
    c.moveTo(x, 0); c.lineTo(x, len);
    c.moveTo(x, H); c.lineTo(x, H - len);
  }
  c.stroke();

  const pulse = 0.55 + 0.35 * Math.sin(S.clk * 5);
  c.globalAlpha = S.hudO * pulse * clamp(S.hudP, 0, 1);
  c.lineWidth = 1; c.strokeStyle = ink;
  const cx = W / 2, cy = H / 2, r0 = 14 + 4 * Math.sin(S.clk * 5) + S.ringPulse * 30, r1 = 36 + S.ringPulse * 60;
  c.beginPath();
  c.moveTo(cx - r1, cy); c.lineTo(cx - r0, cy); c.moveTo(cx + r0, cy); c.lineTo(cx + r1, cy);
  c.moveTo(cx, cy - r1); c.lineTo(cx, cy - r0); c.moveTo(cx, cy + r0); c.lineTo(cx, cy + r1);
  c.stroke();

  // Extra expanding ring on climax
  if (S.ringPulse > 0.01) {
    c.globalAlpha = S.hudO * (1 - S.ringPulse) * 0.6;
    c.strokeStyle = acc;
    c.lineWidth = 2;
    c.beginPath(); c.arc(cx, cy, 80 + S.ringPulse * 700, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.arc(cx, cy, 60 + S.ringPulse * 500, 0, Math.PI * 2); c.stroke();
  }

  const ta = clamp((S.hudP - 0.5) * 2, 0, 1);
  c.globalAlpha = S.hudO * ta;
  c.font = `400 16px ${MONO}`;
  c.fillStyle = ink; c.textBaseline = 'middle';
  const latS = (11 + Math.floor(S.clk * 7)) % 60, lonS = (42 + Math.floor(S.clk * 5)) % 60;
  c.textAlign = 'left';
  c.fillText(`LAT: 36°49'${pad2(latS)}" N`, 48, 58);
  c.fillText(`FRAME: 00:00:${pad2(S.clk)}:${pad2((S.clk % 1) * 24)}`, 48, H - 58);
  c.textAlign = 'right';
  c.fillText(`LON: 36°55'${pad2(lonS)}" E`, W - 48, 58);
  c.fillText('1080P · 60FPS', W - 48, H - 58);
  if (Math.floor(S.clk * 2) % 2 === 0) {
    c.fillStyle = '#ff3b3b'; c.beginPath(); c.arc(W - 48 - 130, H - 58, 4, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}

function drawHeadline(c) {
  const label = (cfg.text || '').toUpperCase().trim();
  if (!label) return;
  const words = label.split(/\s+/);
  let lines = [label];
  if (label.length > 14 && words.length > 1) {
    let best = 0, bestDiff = Infinity;
    for (let m = 1; m < words.length; m++) {
      const a = words.slice(0, m).join(' ').length, b = words.slice(m).join(' ').length;
      if (Math.abs(a - b) < bestDiff) { bestDiff = Math.abs(a - b); best = m; }
    }
    lines = [words.slice(0, best).join(' '), words.slice(best).join(' ')];
  }

  const track = 0.15;
  let size = 130;
  c.font = `900 ${size}px ${cfg.font}`;
  const lineW = s => lines.map(l => {
    const ws = Array.from(l).map(ch => c.measureText(ch).width);
    return ws.reduce((a, b) => a + b, 0) + track * s * Math.max(0, l.length - 1);
  });
  const widest = Math.max(...lineW(size));
  size = Math.floor(size * Math.min(1, 1500 / widest));
  c.font = `900 ${size}px ${cfg.font}`;
  const lh = size * 1.08, blockH = lh * lines.length;

  if (S.heroO > 0.01) {
    c.save();
    c.globalAlpha = S.heroO;
    c.translate(W / 2, H / 2); c.scale(1.7, 1);
    const sg = c.createRadialGradient(0, 0, 0, 0, 0, 430);
    sg.addColorStop(0, 'rgba(0,0,0,0.5)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = sg; c.fillRect(-430, -430, 860, 860);
    c.restore();
  }

  const topY = H / 2 - (blockH / 2) * S.ts;
  const botY = H / 2 + (blockH / 2) * S.ts;

  if (S.t1o > 0.01) {
    c.save();
    c.globalAlpha = clamp(S.t1o, 0, 1);
    c.fillStyle = cfg.ink; c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 12; c.shadowOffsetY = 3;
    const tw = drawTracked(c, (cfg.tag1 || '').toUpperCase(), W / 2, topY - 52, 26, 0.12, MONO, 300);
    c.shadowColor = 'transparent';
    c.fillStyle = cfg.accent;
    c.fillRect(W / 2 - tw / 2 - 70, topY - 54, 44, 3);
    c.fillRect(W / 2 + tw / 2 + 26, topY - 54, 44, 3);
    c.restore();
  }

  // Headline with glitch offset
  c.save();
  const glitchOff = S.headGlitch * (rnd(S.fr) - 0.5) * 30;
  c.translate(W / 2 + glitchOff, H / 2); c.scale(S.ts, S.ts);
  c.fillStyle = cfg.ink;
  c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 20; c.shadowOffsetY = 6;
  c.textAlign = 'left'; c.textBaseline = 'middle';
  let g = 0;
  lines.forEach((l, li) => {
    const chars = Array.from(l);
    const ws = chars.map(ch => c.measureText(ch).width);
    const tr = track * size;
    const total = ws.reduce((a, b) => a + b, 0) + tr * Math.max(0, chars.length - 1);
    const lineTop = -blockH / 2 + li * lh;
    c.save();
    c.beginPath(); c.rect(-total / 2 - 20, lineTop, total + 40, lh); c.clip();
    let x = -total / 2;
    chars.forEach((ch, i) => {
      const p = clamp((S.tr - (0.03 * li + 0.02 * g)) / 0.9, 0, 1);
      const e = expoOut(p);
      if (p > 0 && ch !== ' ') {
        c.globalAlpha = e;
        // Slight bounce overshoot on final lockup
        const bounce = S.letterBounce * Math.sin(S.clk * 20 + i) * 3;
        c.fillText(ch, x, lineTop + lh / 2 + (1 - e) * lh * 1.1 + bounce);
      }
      x += ws[i] + tr; g++;
    });
    c.restore();
  });
  c.restore();

  // Light sweep across headline
  if (S.lightSweep > 0.01 && S.lightSweep < 0.99) {
    c.save();
    c.globalCompositeOperation = 'screen';
    const sweepX = -W * 0.3 + S.lightSweep * W * 1.6;
    const lg = c.createLinearGradient(sweepX - 200, 0, sweepX + 200, 0);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(0.5, `rgba(255,255,255,${0.35 * (1 - Math.abs(S.lightSweep - 0.5) * 2)})`);
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = lg;
    c.fillRect(0, H / 2 - 200, W, 400);
    c.restore();
  }

  if (S.t2o > 0.01) {
    c.save();
    c.globalAlpha = clamp(S.t2o, 0, 1);
    c.fillStyle = cfg.ink; c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 12; c.shadowOffsetY = 3;
    drawTracked(c, (cfg.tag2 || '').toUpperCase(), W / 2, botY + 62, 26, S.t2ls, MONO, 300);
    c.restore();
  }

  if (cfg.logo) {
    const lh2 = 80, lw2 = cfg.logo.width * (lh2 / cfg.logo.height);
    c.save(); c.globalAlpha = clamp(S.t1o, 0, 1);
    c.drawImage(cfg.logo, W / 2 - lw2 / 2, H * 0.15 - lh2 / 2, lw2, lh2);
    c.restore();
  }
}

function drawOverlay() {
  const c = octx;
  c.clearRect(0, 0, W, H);

  // Split-panel slices (Phase 2)
  if (S.sw2 > 0.001 && S.sw2 < 0.999) {
    const N = 12, sw = W / N;
    for (let i = 0; i < N; i++) {
      const lp = clamp(S.sw2 * 1.6 - i * 0.05, 0, 1);
      if (lp <= 0 || lp >= 1) continue;
      const q = aeEaseInOut(lp), dir = i % 2 ? 1 : -1;
      const y = dir * (q * 2 - 1) * H;
      c.fillStyle = 'rgba(10,10,14,0.5)'; c.fillRect(i * sw, y, sw, H);
      c.strokeStyle = 'rgba(255,255,255,0.4)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(i * sw + 0.5, y); c.lineTo(i * sw + 0.5, y + H);
      c.moveTo((i + 1) * sw - 0.5, y); c.lineTo((i + 1) * sw - 0.5, y + H); c.stroke();
    }
  }

  // Intro slices
  if (S.intro < 0.999) {
    const N = 12, bh = H / N;
    for (let i = 0; i < N; i++) {
      const lp = clamp(S.intro * 1.5 - i * 0.04, 0, 1);
      const q = aeEaseOutExpo(lp), dir = i % 2 ? 1 : -1;
      const dx = dir * q * W * 1.05;
      c.fillStyle = BG; c.fillRect(dx, i * bh, W, bh + 1);
      if (q > 0 && q < 1) {
        c.fillStyle = cfg.accent;
        c.fillRect(dir === 1 ? dx - 4 : dx + W, i * bh, 4, bh + 1);
      }
    }
  }

  // Whip pan horizontal streaks
  if (Math.abs(S.whip) > 0.01) {
    c.save();
    c.globalAlpha = Math.min(0.6, Math.abs(S.whip) * 0.8);
    c.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 40; i++) {
      const y = rnd(S.fr + i) * H;
      const x = rnd(S.fr + i + 500) * W;
      const w = 200 + rnd(S.fr + i + 900) * 500;
      c.fillRect(x, y, w * Math.abs(S.whip), 1 + rnd(i) * 2);
    }
    c.restore();
  }

  // Speed streaks during dolly
  if (S.sl > 0.01) {
    c.save();
    c.translate(W / 2, H / 2);
    c.strokeStyle = '#fff';
    for (let i = 0; i < 90; i++) {
      const a = rnd(i + 1) * Math.PI * 2, r0 = 330 + rnd(i + 200) * 320, r1 = r0 + (300 + rnd(i + 400) * 800) * S.sl;
      c.globalAlpha = S.sl * 0.4; c.lineWidth = 1 + rnd(i + 600) * 3;
      c.beginPath(); c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); c.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); c.stroke();
    }
    c.restore();
  }

  // Lockup glow
  if (S.glow > 0.01) {
    c.save();
    c.globalCompositeOperation = 'screen';
    c.globalAlpha = S.glow * 0.25;
    const gg = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 700);
    gg.addColorStop(0, 'rgba(255,255,255,1)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = gg; c.fillRect(0, 0, W, H);
    c.restore();
  }

  // Film burn
  if (S.burn > 0.01) {
    c.save();
    c.globalCompositeOperation = 'screen';
    c.globalAlpha = S.burn * 0.7;
    const bx = W * 0.5 + Math.sin(S.clk * 3) * W * 0.3;
    const by = H * 0.5 + Math.cos(S.clk * 4) * H * 0.3;
    const bg = c.createRadialGradient(bx, by, 0, bx, by, 500 + S.burn * 400);
    bg.addColorStop(0, 'rgba(255,200,50,0.8)');
    bg.addColorStop(0.3, 'rgba(255,100,20,0.4)');
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = bg; c.fillRect(0, 0, W, H);
    c.restore();
  }

  // CRT scanline sweep
  if (S.scanLine > 0.01) {
    c.save();
    const sy = S.scanLine * H;
    const sg = c.createLinearGradient(0, sy - 60, 0, sy + 60);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, `rgba(255,255,255,${0.15 * (1 - Math.abs(S.scanLine - 0.5) * 2)})`);
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sg; c.fillRect(0, sy - 60, W, 120);
    c.restore();
  }

  drawHUD(c);
  drawHeadline(c);

  // Flash
  if (S.flash > 0.005) { c.save(); c.globalAlpha = S.flash; c.fillStyle = '#fff'; c.fillRect(0, 0, W, H); c.restore(); }

  // Vignette
  if (!vignetteGrad) {
    vignetteGrad = octx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, Math.hypot(W, H) / 2);
    vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)'); vignetteGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
  }
  c.fillStyle = vignetteGrad; c.fillRect(0, 0, W, H);

  // Film grain
  if (cfg.fx > 0.01) {
    c.save(); c.globalAlpha = 0.08 * Math.min(1, cfg.fx);
    const seed = S.fr * 1000;
    for (let i = 0; i < 900; i++) {
      c.fillStyle = i % 2 ? '#000' : '#fff';
      c.fillRect(rnd(seed + i) * W, rnd(seed + i + 5000) * H, 2, 2);
    }
    c.restore();
  }

  // RGB split overlay (screen-space) during climax
  if (S.rgbSplit > 0.01) {
    c.save();
    c.globalCompositeOperation = 'screen';
    c.globalAlpha = S.rgbSplit * 0.25;
    const off = S.rgbSplit * 12;
    c.fillStyle = 'rgba(255,0,80,0.4)';
    c.fillRect(-off, 0, W, H);
    c.fillStyle = 'rgba(0,180,255,0.4)';
    c.fillRect(off, 0, W, H);
    c.restore();
  }
}

// ============================================================
// RENDER FRAME
// ============================================================
function renderFrame(t) {
  S.fr = Math.floor(t * 30);
  S.clk = masterTl ? masterTl.time() : 0;

  // Camera shake
  const shake = S.offsetShake;
  const shX = (rnd(S.fr * 13) - 0.5) * shake * 20;
  const shY = (rnd(S.fr * 17) - 0.5) * shake * 20;
  camera.position.x = shX;
  camera.position.y = shY;
  camera.rotation.set(S.tiltX * cfg.fx, S.tiltY * cfg.fx, 0);

  for (const m of planes) {
    const d = m.userData, u = m.material.uniforms;
    let x = d.baseX, y = d.baseY, z = d.baseZ, sx, sy;
    if (d.hero) {
      z += S.par * 60;
      sx = PLANE_SCALE * S.hs;
      sy = PLANE_SCALE * S.hs * S.heroSquash;
    } else {
      x += d.side * (S.split * 200 + S.par * 70 * (1 + d.L * 0.25));
      sx = PLANE_SCALE * 0.85;
      sy = PLANE_SCALE * 0.85;
    }
    m.position.set(x, y, z);
    m.scale.set(sx, sy, 1);
    u.uProgress.value = S.prog;
    u.uAberration.value = S.ab * cfg.fx;
    u.uOpacity.value = d.hero ? S.heroO : S.outerO * (1 - d.L * 0.08);
    u.uMotionBlur.value = S.motionBlur;
    u.uWhip.value = S.whip;
    u.uWhipDir.value = S.whipDir;
    u.uDepthFog.value = S.depthFog * (d.L / 5);
    u.uTime.value = t;
  }
  dust.rotation.y = t * 0.02;
  // Dust burst: increase point size
  dustMat.size = 3 + S.dustBurst * 30;
  dustMat.opacity = 0.45 * (1 - S.dustBurst * 0.5);

  renderer.render(scene, camera);
  drawOverlay();
}

// ============================================================
// MASTER TIMELINE (Cinematic AE-style choreography, ~6.2s)
// ============================================================
let masterTl;
function buildTimeline() {
  if (masterTl) masterTl.kill();
  resetState();
  camera.position.set(0, 0, 1000);

  const tl = gsap.timeline({ paused: true, defaults: { ease: 'none' } });

  // =====================================================
  // PHASE 1 — SLICE MASK & DEPTH FOCUS (0.0 - 1.4s)
  // =====================================================
  tl.to(S, { intro: 1, duration: 1.2, ease: aeEaseOutExpo }, 0)
    .to(S, { hudP: 1, duration: 0.9, ease: aeEaseOutExpo }, 0.05)
    .to(camera.position, { z: 620, duration: 1.8, ease: aeEaseInOutQuint }, 0.1)
    .to(S, { hs: 1.02, duration: 1.1, ease: aeEaseOutBack }, 0.35)
    .to(S, { heroO: 1, duration: 0.8, ease: aeEaseOutExpo }, 0.35)
    .to(S, { outerO: 1, duration: 1.1, ease: aeEaseOutExpo }, 0.4)
    .to(S, { tr: 2.8, duration: 2.8, ease: 'none' }, 0.55)
    .to(S, { t1o: 1, duration: 0.8, ease: aeEaseOutExpo }, 1.0)
    .to(S, { par: 1, duration: 6.2, ease: 'none' }, 0)
    .to(S, { gridPulse: 0.6, duration: 0.5, ease: aeEaseOutExpo }, 0.8)
    .to(S, { gridPulse: 0, duration: 0.6, ease: aeEaseInOut }, 1.3)
    .to(S, { depthFog: 0.35, duration: 1.4, ease: aeEaseOutExpo }, 0.3);

  // =====================================================
  // PHASE 2 — WHIP PAN + SPLIT-PANEL TRANSITION (1.4 - 3.4s)
  // =====================================================
  tl.to(S, { tiltX: -0.06, tiltY: 0.1, duration: 1.2, ease: aeEaseInOutQuint }, 1.3)
    // whip pan right
    .to(S, { whip: 1, whipDir: 1, duration: 0.25, ease: aeEaseOutExpo }, 1.4)
    .to(S, { motionBlur: 1, duration: 0.2, ease: aeEaseOutExpo }, 1.4)
    .to(S, { whip: 0, duration: 0.4, ease: aeEaseInOutQuint }, 1.65)
    .to(S, { motionBlur: 0, duration: 0.4, ease: aeEaseInOut }, 1.65)
    // RGB split pulse at peak whip
    .to(S, { rgbSplit: 1, duration: 0.15, ease: aeEaseOutExpo }, 1.45)
    .to(S, { rgbSplit: 0, duration: 0.5, ease: aeEaseInOut }, 1.6)
    // split planes
    .to(S, { split: 1, duration: 1.3, ease: aeEaseInOutQuint }, 1.5)
    .to(S, { sw2: 1, duration: 1.3, ease: aeEaseInOutQuint }, 1.5)
    // texture crossfade
    .to(S, { prog: 1, duration: 1.1, ease: aeEaseInOutQuint }, 1.7)
    // tagline 2 + letter-spacing
    .to(S, { t2o: 1, duration: 0.9, ease: aeEaseOutExpo }, 2.1)
    .to(S, { t2ls: 0.22, duration: 1.4, ease: aeEaseOutExpo }, 2.1)
    // scanline sweep
    .to(S, { scanLine: 1, duration: 0.7, ease: 'none' }, 1.4)
    .to(S, { scanLine: 0, duration: 0.01, ease: 'none' }, 2.1)
    // dust burst subtle
    .to(S, { dustBurst: 0.5, duration: 0.8, ease: aeEaseOutExpo }, 1.6)
    .to(S, { dustBurst: 0, duration: 1.2, ease: aeEaseInOut }, 2.4);

  // =====================================================
  // PHASE 3 — CLIMAX DOLLY + LOCKUP (3.4 - 5.4s)
  // =====================================================
  tl.to(camera.position, { z: 160, duration: 0.65, ease: aeEaseInExpo }, 3.4)
    // aberration + whip spike
    .to(S, { ab: 0.02, duration: 0.3, ease: aeEaseOutExpo }, 3.4)
    .to(S, { sl: 1, duration: 0.35, ease: aeEaseOutExpo }, 3.4)
    .to(S, { sl: 0, duration: 0.5, ease: aeEaseInOut }, 3.75)
    // camera shake
    .to(S, { offsetShake: 1, duration: 0.15, ease: 'none' }, 3.4)
    .to(S, { offsetShake: 0, duration: 0.5, ease: aeEaseInOut }, 3.55)
    // flash + RGB split
    .to(S, { flash: 0.55, duration: 0.06, ease: 'none' }, 3.92)
    .to(S, { flash: 0, duration: 0.55, ease: aeEaseOutExpo }, 3.98)
    .to(S, { rgbSplit: 1.2, duration: 0.08, ease: 'none' }, 3.92)
    .to(S, { rgbSplit: 0, duration: 0.6, ease: aeEaseOutExpo }, 4.0)
    // film burn
    .to(S, { burn: 0.8, duration: 0.15, ease: aeEaseOutExpo }, 3.92)
    .to(S, { burn: 0, duration: 0.9, ease: aeEaseInOut }, 4.1)
    // ring pulse
    .to(S, { ringPulse: 1, duration: 0.6, ease: aeEaseOutExpo }, 3.95)
    .to(S, { ringPulse: 0, duration: 0.01, ease: 'none' }, 4.6)
    // settle camera
    .to(camera.position, { z: 480, duration: 1.0, ease: aeEaseOutExpo }, 4.1)
    // split returns home
    .to(S, { split: 0, duration: 1.1, ease: aeEaseInOutQuint }, 4.1)
    .to(S, { tiltX: 0, tiltY: 0, duration: 1.1, ease: aeEaseInOutQuint }, 4.1)
    // lockup scale
    .to(S, { ts: 0.94, duration: 1.0, ease: aeEaseInOutQuint }, 4.1)
    .to(S, { glow: 1, duration: 0.9, ease: aeEaseOutExpo }, 4.1)
    // hero squash on impact
    .to(S, { heroSquash: 0.92, duration: 0.15, ease: aeEaseOutExpo }, 3.95)
    .to(S, { heroSquash: 1, duration: 0.6, ease: aeEaseOutElastic }, 4.1)
    // letter bounce on impact
    .to(S, { letterBounce: 1, duration: 0.4, ease: aeEaseOutExpo }, 4.0)
    .to(S, { letterBounce: 0, duration: 0.6, ease: aeEaseInOut }, 4.4)
    // light sweep across headline
    .to(S, { lightSweep: 1, duration: 0.9, ease: aeEaseInOutQuint }, 4.2)
    .to(S, { lightSweep: 0, duration: 0.01, ease: 'none' }, 5.1)
    // HUD dim
    .to(S, { hudO: 0.4, duration: 0.5, ease: aeEaseOutExpo }, 4.7)
    // motion blur tail
    .to(S, { motionBlur: 0.6, duration: 0.2, ease: aeEaseOutExpo }, 3.4)
    .to(S, { motionBlur: 0, duration: 0.6, ease: aeEaseInOut }, 3.6);

  tl.timeScale(cfg.speed);
  masterTl = tl;
  tl.time(0);
}
buildTimeline();

// ============================================================
// PREVIEW LOOP
// ============================================================
let exporting = false, composing = false;
const exportCanvas = document.createElement('canvas');
exportCanvas.width = W; exportCanvas.height = H;
const ectx = exportCanvas.getContext('2d');
function composeExport() {
  ectx.fillStyle = BG;
  ectx.fillRect(0, 0, W, H);
  ectx.drawImage(webglCanvas, 0, 0);
  ectx.drawImage(overlay, 0, 0);
}

const scrub = document.getElementById('scrub');
function loop() {
  requestAnimationFrame(loop);
  if (exporting) return;
  renderFrame(performance.now() / 1000);
  if (composing) composeExport();
  if (masterTl.isActive()) scrub.value = Math.round(masterTl.progress() * 1000);
}
requestAnimationFrame(loop);

// ============================================================
// UI WIRING
// ============================================================
const $ = id => document.getElementById(id);
$('input-text').addEventListener('input', e => cfg.text = e.target.value);
$('input-tag1').addEventListener('input', e => cfg.tag1 = e.target.value);
$('input-tag2').addEventListener('input', e => cfg.tag2 = e.target.value);

$('input-font').addEventListener('change', async e => {
  const f = e.target.value;
  const first = f.split(',')[0].replace(/["']/g, '').trim();
  try { await document.fonts.load(`900 100px "${first}"`); } catch (_) {}
  cfg.font = f;
});

let accentTimer = null;
$('input-color-accent').addEventListener('input', e => {
  cfg.accent = e.target.value;
  document.documentElement.style.setProperty('--accent', e.target.value);
  clearTimeout(accentTimer);
  accentTimer = setTimeout(() => { paintAllTextures(); textures.forEach(t => t.needsUpdate = true); }, 150);
});
$('input-color-text').addEventListener('input', e => { cfg.ink = e.target.value; });
$('input-fx').addEventListener('input', e => cfg.fx = e.target.value / 100);

$('input-logo').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => { cfg.logo = img; };
  img.src = URL.createObjectURL(file);
});
$('btn-clear-logo').addEventListener('click', () => { cfg.logo = null; $('input-logo').value = ''; });

$('input-speed').addEventListener('change', e => {
  cfg.speed = parseFloat(e.target.value) || 1;
  masterTl.timeScale(cfg.speed);
});

$('btn-preview').addEventListener('click', () => { masterTl.timeScale(cfg.speed); masterTl.restart(); });
scrub.addEventListener('input', () => { masterTl.pause(); masterTl.progress(scrub.value / 1000); });

document.fonts.load('900 100px "Montserrat"').catch(() => {});
document.fonts.load('300 20px "JetBrains Mono"').catch(() => {});

// ============================================================
// EXPORT
// ============================================================
const exportBtn = $('btn-export');
const overlayEl = $('recording-overlay');

function finishExport() {
  exporting = false; composing = false;
  exportBtn.disabled = false;
  $('btn-preview').disabled = false;
  overlayEl.style.display = 'none';
  buildTimeline();
}
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.style.display = 'none'; a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

function exportFramePerfect() {
  const FPS = 60;
  const duration = masterTl.duration() / cfg.speed;
  const frames = Math.round((duration + 0.25) * FPS);
  const capturer = new CCapture({ format: 'webm', framerate: FPS, quality: 95, display: false });
  let i = 0;
  exporting = true;
  masterTl.pause(); masterTl.time(0);
  capturer.start();

  function step() {
    if (i >= frames) {
      overlayEl.textContent = '💾 ENCODING WEBM…';
      capturer.stop();
      capturer.save(blob => { download(blob, 'Hero_Intro_1080p.webm'); finishExport(); });
      return;
    }
    const t = i / FPS;
    masterTl.time(Math.min(t * cfg.speed, masterTl.duration()));
    renderFrame(t);
    composeExport();
    capturer.capture(exportCanvas);
    overlayEl.textContent = `🔴 RENDERING ${i + 1} / ${frames}`;
    i++;
    requestAnimationFrame(step);
  }
  step();
}

function exportFast() {
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mime) { alert('MediaRecorder is not supported here. Use frame-perfect mode.'); finishExport(); return; }
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  const rec = new MediaRecorder(exportCanvas.captureStream(60), { mimeType: mime, videoBitsPerSecond: 25e6 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => { download(new Blob(chunks, { type: mime }), `Hero_Intro_1080p.${ext}`); finishExport(); };

  composing = true;
  masterTl.timeScale(cfg.speed);
  masterTl.pause(); masterTl.time(0);
  rec.start();
  masterTl.eventCallback('onComplete', () => {
    masterTl.eventCallback('onComplete', null);
    setTimeout(() => rec.stop(), 400);
  });
  masterTl.play(0);
}

exportBtn.addEventListener('click', async () => {
  exportBtn.disabled = true;
  $('btn-preview').disabled = true;
  overlayEl.style.display = 'block';
  overlayEl.textContent = '🔴 PREPARING…';
  try {
    await Promise.all([
      document.fonts.load(`900 100px ${cfg.font}`),
      document.fonts.load('300 20px "JetBrains Mono"')
    ]);
  } catch (_) {}
  overlayEl.textContent = '🔴 RENDERING…';
  buildTimeline();
  setTimeout(() => {
    if ($('input-export-mode').value === 'fast') exportFast();
    else exportFramePerfect();
  }, 300);
});
</script>
