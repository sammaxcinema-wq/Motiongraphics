<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050507" />
<title>Epic 3D Hero Opener — WebGL + GSAP</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
  }
}
</script>

<style>
/* =========================================================
   DESIGN TOKENS
========================================================= */
:root {
  --bg: #050507;
  --hud: rgba(255, 255, 255, 0.85);
  --grid: rgba(255, 255, 255, 0.15);
  --accent: #22d3ee;
  --font-sans: 'Montserrat', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: white;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

#webgl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
}

/* =========================================================
   HUD OVERLAY
========================================================= */
.hud {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  will-change: opacity;
}

/* SVG frame lines */
.svg-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9;
  opacity: 0;
}
.svg-frame path {
  stroke: var(--hud);
  stroke-width: 1;
  fill: none;
  stroke-dasharray: 2000;
  stroke-dashoffset: 2000;
}

/* Framing brackets */
.bracket {
  position: absolute;
  width: 48px;
  height: 48px;
  border-color: var(--hud);
  border-style: solid;
  border-width: 0;
  opacity: 0;
}
.bracket.tl { top: 24px; left: 24px; border-top-width: 1.5px; border-left-width: 1.5px; }
.bracket.tr { top: 24px; right: 24px; border-top-width: 1.5px; border-right-width: 1.5px; }
.bracket.bl { bottom: 24px; left: 24px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
.bracket.br { bottom: 24px; right: 24px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

/* Rule-of-thirds grid */
.grid-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
}
.grid-overlay .g-line {
  position: absolute;
  background: var(--grid);
}
.grid-overlay .g-line.h { left: 0; right: 0; height: 1px; }
.grid-overlay .g-line.v { top: 0; bottom: 0; width: 1px; }
.grid-overlay .g-line.h1 { top: 33.33%; }
.grid-overlay .g-line.h2 { top: 66.66%; }
.grid-overlay .g-line.v1 { left: 33.33%; }
.grid-overlay .g-line.v2 { left: 66.66%; }

/* Center crosshair */
.crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 28px;
  height: 28px;
  transform: translate(-50%, -50%);
  opacity: 0;
}
.crosshair::before,
.crosshair::after {
  content: '';
  position: absolute;
  background: var(--hud);
}
.crosshair::before { width: 1px; height: 100%; left: 50%; top: 0; }
.crosshair::after { height: 1px; width: 100%; top: 50%; left: 0; }
.crosshair.pulse { animation: crosshairPulse 2s ease-in-out infinite; }

@keyframes crosshairPulse {
  0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
}

/* Coordinate readouts */
.coord {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--hud);
  line-height: 1.7;
  opacity: 0;
  text-transform: uppercase;
}
.coord.tl { top: 90px; left: 24px; }
.coord.tr { top: 90px; right: 24px; text-align: right; }
.coord.bl { bottom: 90px; left: 24px; }
.coord.br { bottom: 90px; right: 24px; text-align: right; }
.coord .label { color: var(--accent); margin-right: 6px; }

/* Tick rails */
.tick-rail {
  position: absolute;
  left: 0;
  right: 0;
  height: 5px;
  display: flex;
  justify-content: space-between;
  padding: 0 24px;
  opacity: 0;
  pointer-events: none;
}
.tick-rail.top { top: 6px; }
.tick-rail.bottom { bottom: 6px; }
.tick-rail .tick {
  width: 1px;
  height: 5px;
  background: var(--hud);
  opacity: 0.6;
}

/* =========================================================
   TYPOGRAPHY
========================================================= */
.title-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 20;
  pointer-events: none;
  width: 90%;
  max-width: 1400px;
  transform-origin: center center;
}
.headline {
  font-family: var(--font-sans);
  font-weight: 900;
  font-size: clamp(40px, 8vw, 128px);
  line-height: 0.9;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin: 0;
  color: white;
  text-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
}
.headline .line { display: block; overflow: hidden; }
.headline .char {
  display: inline-block;
  transform: translateY(100%);
  opacity: 0;
  will-change: transform, opacity;
}
.subtitle {
  margin-top: 20px;
  font-family: var(--font-mono);
  font-size: clamp(10px, 1.2vw, 14px);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0;
  font-weight: 400;
  transition: letter-spacing 0.3s ease;
}
.subtitle .char {
  display: inline-block;
  opacity: 0;
  will-change: opacity;
}

/* =========================================================
   LOADER
========================================================= */
#loader {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  transition: opacity 0.6s ease;
}
#loader.hidden { opacity: 0; pointer-events: none; }
#loader .spinner {
  width: 48px;
  height: 48px;
  border: 2px solid rgba(255, 255, 255, 0.1);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
#loader .label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 3px;
  color: rgba(255, 255, 255, 0.5);
  text-transform: uppercase;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 768px) {
  .coord { font-size: 8px; letter-spacing: 1px; }
  .coord.tl { top: 70px; left: 16px; }
  .coord.tr { top: 70px; right: 16px; }
  .coord.bl { bottom: 70px; left: 16px; }
  .coord.br { bottom: 70px; right: 16px; }
  .bracket { width: 32px; height: 32px; }
  .bracket.tl { top: 16px; left: 16px; }
  .bracket.tr { top: 16px; right: 16px; }
  .bracket.bl { bottom: 16px; left: 16px; }
  .bracket.br { bottom: 16px; right: 16px; }
  .tick-rail .tick:nth-child(even) { display: none; }
}
</style>
</head>

<body>

<div id="loader">
  <div class="spinner"></div>
  <div class="label">Initializing Motion Engine</div>
</div>

<div id="stage">
  <canvas id="webgl"></canvas>

  <div class="hud" id="hud">
    <!-- SVG vector frame lines -->
    <svg class="svg-frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M 0 15 L 100 15" />
      <path d="M 0 85 L 100 85" />
      <path d="M 15 0 L 15 100" />
      <path d="M 85 0 L 85 100" />
    </svg>

    <!-- Framing brackets -->
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>

    <!-- Rule-of-thirds grid -->
    <div class="grid-overlay">
      <div class="g-line h h1"></div>
      <div class="g-line h h2"></div>
      <div class="g-line v v1"></div>
      <div class="g-line v v2"></div>
    </div>

    <!-- Center crosshair -->
    <div class="crosshair pulse"></div>

    <!-- Tick rails (populated by JS) -->
    <div class="tick-rail top" id="ticks-top"></div>
    <div class="tick-rail bottom" id="ticks-bottom"></div>

    <!-- Coordinate readouts -->
    <div class="coord tl">
      <div><span class="label">LAT</span>36°49'11" N</div>
      <div><span class="label">LON</span>36°55'42" E</div>
    </div>
    <div class="coord tr">
      <div><span class="label">FRAME</span><span id="frame-readout">00:00:00:00</span></div>
      <div><span class="label">FPS</span><span id="fps-readout">--</span></div>
    </div>
    <div class="coord bl">
      <div><span class="label">SYS</span>MOTION.ENGINE</div>
      <div><span class="label">STAT</span>ONLINE</div>
    </div>
    <div class="coord br">
      <div><span class="label">Z</span><span id="z-readout">1000.00</span></div>
      <div><span class="label">ROLL</span><span id="roll-readout">0.00°</span></div>
    </div>

    <!-- Typography -->
    <div class="title-wrap" id="title-wrap">
      <h1 class="headline" id="headline">
        <span class="line" id="line-1"></span>
        <span class="line" id="line-2"></span>
      </h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
  </div>
</div>

<script type="module">
/* =========================================================
   IMPORTS
========================================================= */
import * as THREE from 'three';
import gsap from 'gsap';

/* =========================================================
   CONFIG
========================================================= */
const CONFIG = {
  layers: [0, -150, -300, -450, -600],
  panelsPerLayer: [3, 4, 5, 6, 4],
  panelW: 16,
  panelH: 9,
  cameraStart: 1000,
  cameraMid: 700,
  cameraEnd: 200,
  titleLines: ['MAXING &', 'TRANSACTIONS'],
  subtitle: 'NO PLUGINS REQUIRED',
  hudInset: 24,
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* =========================================================
   SHADERS
========================================================= */
const vertexShader = /* glsl */ `
  varying vec2 vUv;
  varying vec3 vWorldPos;

  void main() {
    vUv = uv;
    vec4 world = modelMatrix * vec4(position, 1.0);
    vWorldPos = world.xyz;
    gl_Position = projectionMatrix * viewMatrix * world;
  }
`;

const fragmentShader = /* glsl */ `
  precision highp float;

  uniform sampler2D uTexA;
  uniform sampler2D uTexB;
  uniform float uProgress;
  uniform float uAberration;
  uniform float uOpacity;
  uniform float uTime;
  uniform float uDepth;
  uniform float uBorderWidth;
  uniform vec3  uBorderColor;
  uniform vec2  uResolution;

  varying vec2 vUv;
  varying vec3 vWorldPos;

  vec4 sampleBlurred(sampler2D tex, vec2 uv, float blurAmount) {
    if (blurAmount <= 0.001) return texture2D(tex, uv);

    vec2 texel = 1.0 / uResolution;
    vec4 sum = vec4(0.0);
    float weights[9] = float[9](0.051, 0.0918, 0.12245, 0.1531, 0.1633, 0.1531, 0.12245, 0.0918, 0.051);
    float offset = blurAmount;

    for (int i = 0; i < 9; i++) {
      float x = (float(i) - 4.0) * offset * texel.x;
      float y = (float(i) - 4.0) * offset * texel.y;
      sum += texture2D(tex, uv + vec2(x, y)) * weights[i];
      sum += texture2D(tex, uv + vec2(-x, -y)) * weights[i];
    }
    return sum * 0.5;
  }

  void main() {
    float blurAmount = clamp((-uDepth - 400.0) / 200.0, 0.0, 1.0) * 3.5;

    vec2 dir = normalize(vUv - 0.5);
    vec2 offset = dir * uAberration;

    vec4 aR = sampleBlurred(uTexA, vUv + offset, blurAmount);
    vec4 aG = sampleBlurred(uTexA, vUv, blurAmount);
    vec4 aB = sampleBlurred(uTexA, vUv - offset, blurAmount);
    vec4 texA = vec4(aR.r, aG.g, aB.b, aG.a);

    vec4 bR = sampleBlurred(uTexB, vUv + offset, blurAmount);
    vec4 bG = sampleBlurred(uTexB, vUv, blurAmount);
    vec4 bB = sampleBlurred(uTexB, vUv - offset, blurAmount);
    vec4 texB = vec4(bR.r, bG.g, bB.b, bG.a);

    vec4 mixed = mix(texA, texB, uProgress);

    vec2 edgeUV = vUv;
    float borderDist = min(min(edgeUV.x, 1.0 - edgeUV.x), min(edgeUV.y, 1.0 - edgeUV.y));
    float borderMask = 1.0 - smoothstep(0.0, uBorderWidth, borderDist);

    vec2 sheenUV = vUv - 0.5;
    float sheen = smoothstep(0.4, 0.0, length(sheenUV)) * 0.15;

    vec3 borderRGB = uBorderColor + vec3(sheen);
    vec3 finalRGB = mix(mixed.rgb, borderRGB, borderMask);

    float alpha = mixed.a * uOpacity;
    alpha = max(alpha, borderMask * uOpacity * 0.9);

    gl_FragColor = vec4(finalRGB, alpha);
  }
`;

/* =========================================================
   SCENE SETUP
========================================================= */
const canvas = document.getElementById('webgl');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050507);
scene.fog = new THREE.Fog(0x050507, 800, 2000);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  3000
);
camera.position.set(0, 0, CONFIG.cameraStart);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x050507);

/* =========================================================
   LIGHTS
========================================================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(8, 14, 12);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x22d3ee, 0.6);
rimLight.position.set(-12, -6, -8);
scene.add(rimLight);

/* =========================================================
   PROCEDURAL TEXTURES
========================================================= */
function makeTexture(hue, label) {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 576;
  const ctx = c.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 1024, 576);
  grad.addColorStop(0, `hsl(${hue}, 65%, 45%)`);
  grad.addColorStop(1, `hsl(${(hue + 40) % 360}, 75%, 12%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 576);

  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 1024; i += 96) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 576); ctx.stroke();
  }
  for (let i = 0; i < 576; i += 96) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 72px Montserrat, sans-serif';
  ctx.fillText(label, 40, 520);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

const textures = Array.from({ length: 6 }, (_, i) =>
  makeTexture(180 + i * 45, `PANEL-0${i + 1}`)
);

/* =========================================================
   PANEL BUILDER
========================================================= */
const panels = [];
const uniformRegistry = new Map(); // panelIndex → uniforms

let panelId = 0;

CONFIG.layers.forEach((z, layerIndex) => {
  const count = CONFIG.panelsPerLayer[layerIndex];
  const spread = 22 + layerIndex * 4;

  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const x = (t - 0.5) * spread;
    const y = (layerIndex % 2 === 0 ? 1 : -1) * (i % 2 === 0 ? 2.5 : -2.5);
    const rotationY = (t - 0.5) * 0.25;
    const rotationZ = (Math.random() - 0.5) * 0.05;

    const column = x < -3 ? 'left' : x > 3 ? 'right' : 'center';

    const uniforms = {
      uTexA: { value: textures[panelId % 6] },
      uTexB: { value: textures[(panelId + 3) % 6] },
      uProgress: { value: 0 },
      uAberration: { value: 0.005 },
      uOpacity: { value: 0 },
      uTime: { value: 0 },
      uDepth: { value: z },
      uBorderWidth: { value: 0.012 },
      uBorderColor: { value: new THREE.Color(0xffffff) },
      uResolution: { value: new THREE.Vector2(1024, 576) },
    };

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      transparent: true,
      side: THREE.DoubleSide,
      uniforms,
    });

    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(CONFIG.panelW, CONFIG.panelH),
      material
    );

    mesh.position.set(x, y, z);
    mesh.rotation.set(0, rotationY, rotationZ);
    mesh.scale.setScalar(layerIndex === 0 ? 1.0 : 0.9);

    mesh.userData = {
      baseX: x,
      baseY: y,
      baseZ: z,
      column,
      layerIndex,
      panelIndex: panelId,
      uniforms,
    };

    scene.add(mesh);
    panels.push(mesh);
    uniformRegistry.set(panelId, uniforms);
    panelId++;
  }
});

/* =========================================================
   AMBIENT DUST (depth enhancer)
========================================================= */
const dustGeo = new THREE.BufferGeometry();
const dustPositions = new Float32Array(600 * 3);
for (let i = 0; i < 600 * 3; i += 3) {
  dustPositions[i] = (Math.random() - 0.5) * 80;
  dustPositions[i + 1] = (Math.random() - 0.5) * 50;
  dustPositions[i + 2] = -Math.random() * 700;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
const dust = new THREE.Points(
  dustGeo,
  new THREE.PointsMaterial({
    color: 0x88eaff,
    size: 1.2,
    transparent: true,
    opacity: 0.5,
    sizeAttenuation: true,
  })
);
scene.add(dust);

/* =========================================================
   TITLE SPLIT
========================================================= */
function splitIntoLine(container, text) {
  container.innerHTML = '';
  const chars = [];
  [...text].forEach((ch) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    container.appendChild(span);
    chars.push(span);
  });
  return chars;
}

const line1El = document.getElementById('line-1');
const line2El = document.getElementById('line-2');
const subtitleEl = document.getElementById('subtitle');

const titleChars = [
  ...splitIntoLine(line1El, CONFIG.titleLines[0]),
  ...splitIntoLine(line2El, CONFIG.titleLines[1]),
];

const subtitleChars = splitIntoLine(subtitleEl, CONFIG.subtitle);

/* =========================================================
   TICK RAILS
========================================================= */
function buildTicks(container, count = 40) {
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick';
    container.appendChild(tick);
  }
}
buildTicks(document.getElementById('ticks-top'));
buildTicks(document.getElementById('ticks-bottom'));

/* =========================================================
   CAMERA PARALLAX (pointer)
========================================================= */
const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
window.addEventListener('pointermove', (e) => {
  pointer.tx = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.ty = (e.clientY / window.innerHeight) * 2 - 1;
}, { passive: true });

/* Camera base — mutated by GSAP timeline */
const camBase = {
  x: 0, y: 0, z: CONFIG.cameraStart,
  rotX: 0, rotY: 0, rotZ: 0,
};

/* =========================================================
   READOUT REFS
========================================================= */
const fpsEl = document.getElementById('fps-readout');
const frameEl = document.getElementById('frame-readout');
const zEl = document.getElementById('z-readout');
const rollEl = document.getElementById('roll-readout');

/* =========================================================
   RENDER LOOP
========================================================= */
const clock = new THREE.Clock();
let fpsFrames = 0;
let fpsLast = 0;
let rafId = 0;
let startTime = performance.now();

function tick() {
  rafId = requestAnimationFrame(tick);
  const t = clock.getElapsedTime();

  /* Pointer smoothing */
  pointer.x += (pointer.tx - pointer.x) * 0.05;
  pointer.y += (pointer.ty - pointer.y) * 0.05;

  /* Camera: base (GSAP) + pointer offset */
  camera.position.x = camBase.x + pointer.x * 1.2;
  camera.position.y = camBase.y - pointer.y * 0.9;
  camera.position.z = camBase.z;
  camera.rotation.x = camBase.rotX - pointer.y * 0.06;
  camera.rotation.y = camBase.rotY + pointer.x * 0.1;
  camera.rotation.z = camBase.rotZ;

  /* Time uniform for all panels */
  uniformRegistry.forEach((u) => { u.uTime.value = t; });

  /* Dust drift */
  dust.rotation.z = t * 0.005;

  /* Readouts */
  fpsFrames++;
  if (t - fpsLast > 0.5) {
    fpsEl.textContent = String(Math.round(fpsFrames / (t - fpsLast)));
    fpsFrames = 0;
    fpsLast = t;
  }
  zEl.textContent = camera.position.z.toFixed(2);
  rollEl.textContent = `${(camera.rotation.z * 180 / Math.PI).toFixed(2)}°`;
  const elapsed = (performance.now() - startTime) / 1000;
  const frames = Math.floor(elapsed * 60);
  const hh = String(Math.floor(frames / 216000)).padStart(2, '0');
  const mm = String(Math.floor(frames / 3600) % 60).padStart(2, '0');
  const ss = String(Math.floor(frames / 60) % 60).padStart(2, '0');
  const ff = String(frames % 60).padStart(2, '0');
  frameEl.textContent = `${hh}:${mm}:${ss}:${ff}`;

  renderer.render(scene, camera);
}

/* =========================================================
   GSAP TIMELINE
========================================================= */
let masterTl;

function buildTimeline() {
  if (masterTl) masterTl.kill();
  gsap.killTweensOf('*');
  startTime = performance.now();

  /* Reset HUD */
  gsap.set('.svg-frame', { opacity: 0 });
  gsap.set('.svg-frame path', { strokeDashoffset: 2000 });
  gsap.set('.bracket', { opacity: 0 });
  gsap.set('.grid-overlay', { opacity: 0 });
  gsap.set('.tick-rail', { opacity: 0 });
  gsap.set('.coord', { opacity: 0 });
  gsap.set('.crosshair', { opacity: 0 });
  gsap.set(titleChars, { yPercent: 100, opacity: 0 });
  gsap.set(subtitleChars, { opacity: 0 });
  gsap.set(subtitleEl, { letterSpacing: '0.05em' });
  gsap.set('#title-wrap', { scale: 1 });
  gsap.set('#hud', { opacity: 1 });

  /* Reset panels */
  panels.forEach((p) => {
    p.position.set(p.userData.baseX, p.userData.baseY, p.userData.baseZ);
    p.rotation.set(0, p.rotation.y, p.rotation.z);
    p.scale.setScalar(p.userData.layerIndex === 0 ? 0.8 : 0.9);
    p.userData.uniforms.uProgress.value = 0;
    p.userData.uniforms.uAberration.value = 0.005;
    p.userData.uniforms.uOpacity.value = 0;
  });

  /* Reset camera */
  Object.assign(camBase, {
    x: 0, y: 0, z: CONFIG.cameraStart,
    rotX: 0, rotY: 0, rotZ: 0,
  });

  masterTl = gsap.timeline({ defaults: { ease: 'power3.out' } });

  /* ============================================================
     PHASE 1: Grid Draw & Focus (0.0s – 1.2s)
  ============================================================ */
  masterTl
    .to('.svg-frame', { opacity: 1, duration: 0.1 }, 0)
    .to('.svg-frame path', {
      strokeDashoffset: 0,
      duration: 0.8,
      ease: 'power3.out',
      stagger: 0.08,
    }, 0)
    .to('.bracket', { opacity: 1, duration: 0.6, stagger: 0.06 }, 0.05)
    .to('.grid-overlay', { opacity: 1, duration: 0.7 }, 0.1)
    .to('.tick-rail', { opacity: 1, duration: 0.6, stagger: 0.1 }, 0.15)
    .to('.coord', { opacity: 1, duration: 0.5, stagger: 0.08 }, 0.2)
    .to('.crosshair', { opacity: 1, duration: 0.4 }, 0.25);

  /* 0.2s — Camera dolly 1000 → 700 */
  masterTl.to(camBase, {
    z: CONFIG.cameraMid,
    duration: 1.0,
    ease: 'power2.out',
  }, 0.2);

  /* 0.4s — Panels fade in + central scale up */
  panels.forEach((p, idx) => {
    const isCentral = p.userData.column === 'center';
    const targetScale = isCentral ? 1.0 : 0.95;

    masterTl.to(p.scale, {
      x: targetScale,
      y: targetScale,
      duration: 0.9,
      ease: 'power2.out',
    }, 0.4 + idx * 0.015);

    masterTl.to(p.userData.uniforms.uOpacity, {
      value: 1,
      duration: 0.8,
      ease: 'power2.out',
    }, 0.4 + idx * 0.025);
  });

  /* 0.6s — Headline chars slide up */
  masterTl.to(titleChars, {
    yPercent: 0,
    opacity: 1,
    duration: 0.7,
    ease: 'power3.out',
    stagger: 0.03,
  }, 0.6);

  /* ============================================================
     PHASE 2: Split-Panel Parallax Transition (1.2s – 3.2s)
  ============================================================ */
  /* 1.2s — Camera tilt */
  masterTl.to(camBase, {
    rotX: -0.05,
    rotY: 0.08,
    duration: 1.0,
    ease: 'power2.inOut',
  }, 1.2);

  /* 1.4s — Split masks */
  panels.forEach((p) => {
    const col = p.userData.column;
    const xOffset = col === 'left' ? -2.4 : col === 'right' ? 2.4 : 0;
    masterTl.to(p.position, {
      x: p.userData.baseX + xOffset,
      duration: 1.6,
      ease: 'power2.inOut',
    }, 1.4);
  });

  /* 1.6s — Texture crossfade */
  panels.forEach((p, i) => {
    masterTl.to(p.userData.uniforms.uProgress, {
      value: 1,
      duration: 1.0,
      ease: 'power2.inOut',
    }, 1.6 + i * 0.02);
  });

  /* 2.0s — Subtitle enters */
  masterTl.to(subtitleChars, {
    opacity: 1,
    duration: 0.8,
    stagger: 0.015,
    ease: 'power2.out',
  }, 2.0);
  masterTl.to(subtitleEl, {
    letterSpacing: '0.2em',
    duration: 1.2,
    ease: 'power2.inOut',
  }, 2.0);

  /* ============================================================
     PHASE 3: Climax Zoom & Outro Lockup (3.2s – 5.0s)
  ============================================================ */
  /* 3.2s — Fast dolly zoom 700 → 200 */
  masterTl.to(camBase, {
    z: CONFIG.cameraEnd,
    duration: 1.2,
    ease: 'expo.inOut',
  }, 3.2);

  /* 3.5s — Aberration spike */
  panels.forEach((p) => {
    masterTl.to(p.userData.uniforms.uAberration, {
      value: 0.02,
      duration: 0.2,
      ease: 'power4.out',
    }, 3.5);
    masterTl.to(p.userData.uniforms.uAberration, {
      value: 0,
      duration: 0.8,
      ease: 'power2.in',
    }, 3.7);
  });

  /* 3.6s — Camera tilt unwinds */
  masterTl.to(camBase, {
    rotX: 0,
    rotY: 0,
    duration: 1.2,
    ease: 'power2.inOut',
  }, 3.6);

  /* 4.0s — Panels drift back + headline scales down */
  panels.forEach((p) => {
    masterTl.to(p.position, {
      x: p.userData.baseX,
      duration: 0.9,
      ease: 'power2.out',
    }, 4.0);
  });
  masterTl.to('#title-wrap', {
    scale: 0.92,
    duration: 1.0,
    ease: 'power2.inOut',
  }, 4.0);

  /* 4.5s — HUD dims */
  masterTl.to('#hud', {
    opacity: 0.4,
    duration: 0.5,
    ease: 'power2.out',
  }, 4.5);

  return masterTl;
}

/* =========================================================
   RESIZE
========================================================= */
let resizeRaf = 0;
function onResize() {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  });
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

/* =========================================================
   VISIBILITY PAUSE
========================================================= */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(rafId);
    masterTl?.pause();
  } else {
    clock.getDelta();
    tick();
    masterTl?.play();
  }
});

/* =========================================================
   BOOT
========================================================= */
function boot() {
  tick();
  buildTimeline();

  const loader = document.getElementById('loader');
  setTimeout(() => {
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 700);
  }, 200);

  setTimeout(() => masterTl.play(0), 400);
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(boot);
} else {
  window.addEventListener('load', boot);
}

/* =========================================================
   PUBLIC API
========================================================= */
window.HeroEngine = {
  replay() {
    buildTimeline();
    masterTl.play(0);
  },
  setHeadline(line1, line2, subtitle) {
    CONFIG.titleLines = [line1, line2 || ''];
    if (subtitle) CONFIG.subtitle = subtitle;

    splitIntoLine(line1El, line1);
    if (line2) splitIntoLine(line2El, line2);
    else line2El.innerHTML = '';
    splitIntoLine(subtitleEl, CONFIG.subtitle);

    /* Rebuild char references */
    titleChars.length = 0;
    titleChars.push(
      ...line1El.querySelectorAll('.char'),
      ...line2El.querySelectorAll('.char')
    );
    subtitleChars.length = 0;
    subtitleChars.push(...subtitleEl.querySelectorAll('.char'));

    buildTimeline();
    masterTl.play(0);
  },
  destroy() {
    cancelAnimationFrame(rafId);
    masterTl?.kill();
    panels.forEach((p) => {
      p.geometry.dispose();
      p.material.dispose();
    });
    dustGeo.dispose();
    (dust.material).dispose();
    textures.forEach((t) => t.dispose());
    renderer.dispose();
  },
};
</script>
