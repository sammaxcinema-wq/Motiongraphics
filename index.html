<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050507" />
<title>Epic 3D Hero Opener — Production</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
  }
}
</script>

<style>
/* =========================================================
   TOKENS
========================================================= */
:root {
  --bg: #050507;
  --hud: rgba(255, 255, 255, 0.85);
  --grid: rgba(255, 255, 255, 0.15);
  --accent: #22d3ee;
  --font-sans: 'Montserrat', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: white;
  overflow: hidden;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

#webgl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
}

/* =========================================================
   HUD
========================================================= */
.hud {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  will-change: opacity;
}

.bracket {
  position: absolute;
  width: 48px;
  height: 48px;
  border-color: var(--hud);
  border-style: solid;
  border-width: 0;
  opacity: 0;
}
.bracket.tl { top: 24px; left: 24px; border-top-width: 1.5px; border-left-width: 1.5px; }
.bracket.tr { top: 24px; right: 24px; border-top-width: 1.5px; border-right-width: 1.5px; }
.bracket.bl { bottom: 24px; left: 24px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
.bracket.br { bottom: 24px; right: 24px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

.grid-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
}
.grid-overlay .g-line {
  position: absolute;
  background: var(--grid);
}
.grid-overlay .g-line.h { left: 0; right: 0; height: 1px; }
.grid-overlay .g-line.v { top: 0; bottom: 0; width: 1px; }
.grid-overlay .g-line.h1 { top: 33.33%; }
.grid-overlay .g-line.h2 { top: 66.66%; }
.grid-overlay .g-line.v1 { left: 33.33%; }
.grid-overlay .g-line.v2 { left: 66.66%; }

.crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 28px;
  height: 28px;
  transform: translate(-50%, -50%);
  opacity: 0;
}
.crosshair::before,
.crosshair::after {
  content: '';
  position: absolute;
  background: var(--hud);
}
.crosshair::before { width: 1px; height: 100%; left: 50%; top: 0; }
.crosshair::after { height: 1px; width: 100%; top: 50%; left: 0; }
.crosshair.pulse { animation: crosshairPulse 2s ease-in-out infinite; }

@keyframes crosshairPulse {
  0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
}

.coord {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--hud);
  line-height: 1.7;
  opacity: 0;
  text-transform: uppercase;
}
.coord.tl { top: 90px; left: 24px; }
.coord.tr { top: 90px; right: 24px; text-align: right; }
.coord.bl { bottom: 90px; left: 24px; }
.coord.br { bottom: 90px; right: 24px; text-align: right; }
.coord .label { color: var(--accent); margin-right: 6px; }

.tick-rail {
  position: absolute;
  left: 0;
  right: 0;
  height: 5px;
  display: flex;
  justify-content: space-between;
  padding: 0 24px;
  opacity: 0;
  pointer-events: none;
}
.tick-rail.top { top: 6px; }
.tick-rail.bottom { bottom: 6px; }
.tick-rail .tick {
  width: 1px;
  height: 5px;
  background: var(--hud);
  opacity: 0.6;
}

/* =========================================================
   TYPOGRAPHY
========================================================= */
.title-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 20;
  pointer-events: none;
  width: 90%;
  max-width: 1400px;
  will-change: transform;
}
.headline {
  font-family: var(--font-sans);
  font-weight: 900;
  font-size: clamp(40px, 8vw, 128px);
  line-height: 0.9;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin: 0;
  color: white;
  text-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
}
.headline .line {
  display: block;
  overflow: hidden;
}
.headline .char {
  display: inline-block;
  transform: translateY(100%);
  opacity: 0;
  will-change: transform, opacity;
}
.subtitle {
  margin-top: 20px;
  font-family: var(--font-mono);
  font-size: clamp(10px, 1.2vw, 14px);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0;
  font-weight: 400;
  will-change: letter-spacing, opacity;
}
.subtitle .char {
  display: inline-block;
  opacity: 0;
  will-change: opacity;
}

/* =========================================================
   SVG FRAME LINES
========================================================= */
.svg-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9;
  opacity: 0;
}
.svg-frame path {
  stroke: var(--hud);
  stroke-width: 1;
  fill: none;
  stroke-dasharray: 2000;
  stroke-dashoffset: 2000;
}

/* =========================================================
   LOADER
========================================================= */
#loader {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  transition: opacity 0.6s ease;
}
#loader.hidden { opacity: 0; pointer-events: none; }
#loader .spinner {
  width: 48px;
  height: 48px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
#loader .label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* =========================================================
   RESPONSIVE
========================================================= */
@media (max-width: 768px) {
  .bracket { width: 32px; height: 32px; }
  .coord { font-size: 8px; letter-spacing: 1px; }
  .coord.tl, .coord.tr { top: 70px; }
  .coord.bl, .coord.br { bottom: 70px; }
  .tick-rail { padding: 0 16px; }
  .tick-rail .tick { height: 4px; }
}
</style>
</head>

<body>

<div id="loader">
  <div class="spinner"></div>
  <div class="label">Initializing Motion Engine</div>
</div>

<div id="stage">
  <canvas id="webgl"></canvas>

  <div class="hud" id="hud">
    <svg class="svg-frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M 0 15 L 100 15" />
      <path d="M 0 85 L 100 85" />
      <path d="M 15 0 L 15 100" />
      <path d="M 85 0 L 85 100" />
    </svg>

    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>

    <div class="grid-overlay">
      <div class="g-line h h1"></div>
      <div class="g-line h h2"></div>
      <div class="g-line v v1"></div>
      <div class="g-line v v2"></div>
    </div>

    <div class="crosshair pulse"></div>

    <div class="tick-rail top" id="ticks-top"></div>
    <div class="tick-rail bottom" id="ticks-bottom"></div>

    <div class="coord tl">
      <div><span class="label">LAT</span>36°49'11" N</div>
      <div><span class="label">LON</span>36°55'42" E</div>
    </div>
    <div class="coord tr">
      <div><span class="label">FRAME</span><span id="frame-readout">00:01:24:12</span></div>
      <div><span class="label">FPS</span><span id="fps-readout">--</span></div>
    </div>
    <div class="coord bl">
      <div><span class="label">SYS</span>MOTION.ENGINE</div>
      <div><span class="label">STAT</span>ONLINE</div>
    </div>
    <div class="coord br">
      <div><span class="label">Z</span><span id="z-readout">1000.00</span></div>
      <div><span class="label">ROLL</span><span id="roll-readout">0.00°</span></div>
    </div>

    <div class="title-wrap" id="title-wrap">
      <h1 class="headline" id="headline" aria-label="Maxing and Transactions">
        <span class="line" data-line="1"></span>
        <span class="line" data-line="2"></span>
      </h1>
      <div class="subtitle" id="subtitle" aria-label="No plugins required"></div>
    </div>
  </div>
</div>

<script type="module">
/* =========================================================
   IMPORTS
========================================================= */
import * as THREE from 'three';
import gsap from 'gsap';

/* =========================================================
   CONFIG
========================================================= */
const HERO = {
  layers: [0, -150, -300, -450, -600],
  panelsPerLayer: [3, 4, 5, 6, 4],
  panelW: 16,
  panelH: 9,
  cameraStart: 1000,
  cameraMid: 700,
  cameraEnd: 200,
  titleLines: ['MAXING &', 'TRANSACTIONS'],
  subtitle: 'NO PLUGINS REQUIRED',
};

/* =========================================================
   UTILS
========================================================= */
const rand = (a, b) => a + Math.random() * (b - a);

/* =========================================================
   SHADERS
========================================================= */
const vertexShader = /* glsl */ `
  varying vec2 vUv;
  varying vec3 vWorldPos;
  void main() {
    vUv = uv;
    vec4 world = modelMatrix * vec4(position, 1.0);
    vWorldPos = world.xyz;
    gl_Position = projectionMatrix * viewMatrix * world;
  }
`;

const fragmentShader = /* glsl */ `
  precision highp float;

  uniform sampler2D uTexA;
  uniform sampler2D uTexB;
  uniform float uProgress;
  uniform float uAberration;
  uniform float uOpacity;
  uniform float uTime;
  uniform float uDepth;
  uniform float uBorderWidth;
  uniform vec3  uBorderColor;
  uniform vec2  uResolution;

  varying vec2 vUv;
  varying vec3 vWorldPos;

  vec4 sampleBlurred(sampler2D tex, vec2 uv, float blurAmount) {
    if (blurAmount <= 0.001) return texture2D(tex, uv);
    vec2 texel = 1.0 / uResolution;
    vec4 sum = vec4(0.0);
    float weights[5];
    weights[0] = 0.227027;
    weights[1] = 0.1945946;
    weights[2] = 0.1216216;
    weights[3] = 0.054054;
    weights[4] = 0.016216;

    float offset = blurAmount;
    for (int i = 0; i < 5; i++) {
      vec2 o = vec2(float(i) * offset) * texel;
      sum += texture2D(tex, uv + o) * weights[i];
      if (i > 0) sum += texture2D(tex, uv - o) * weights[i];
    }
    // horizontal + vertical = separable blur
    vec4 vert = vec4(0.0);
    for (int i = 0; i < 5; i++) {
      vec2 o = vec2(0.0, float(i) * offset) * texel;
      vert += texture2D(tex, uv + o) * weights[i];
      if (i > 0) vert += texture2D(tex, uv - o) * weights[i];
    }
    return (sum + vert) * 0.5;
  }

  void main() {
    float blurAmount = clamp((-uDepth - 400.0) / 200.0, 0.0, 1.0) * 3.5;

    vec2 dir = normalize(vUv - 0.5);
    vec2 offset = dir * uAberration;

    vec4 aR = sampleBlurred(uTexA, vUv + offset, blurAmount);
    vec4 aG = sampleBlurred(uTexA, vUv,          blurAmount);
    vec4 aB = sampleBlurred(uTexA, vUv - offset, blurAmount);
    vec4 texA = vec4(aR.r, aG.g, aB.b, aG.a);

    vec4 bR = sampleBlurred(uTexB, vUv + offset, blurAmount);
    vec4 bG = sampleBlurred(uTexB, vUv,          blurAmount);
    vec4 bB = sampleBlurred(uTexB, vUv - offset, blurAmount);
    vec4 texB = vec4(bR.r, bG.g, bB.b, bG.a);

    vec4 mixed = mix(texA, texB, uProgress);

    vec2 edgeUV = vUv;
    float borderDist = min(min(edgeUV.x, 1.0 - edgeUV.x), min(edgeUV.y, 1.0 - edgeUV.y));
    float borderMask = 1.0 - smoothstep(0.0, uBorderWidth, borderDist);

    vec2 sheenUV = vUv - 0.5;
    float sheen = smoothstep(0.4, 0.0, length(sheenUV)) * 0.15;

    vec3 borderRGB = uBorderColor + vec3(sheen);
    vec3 finalRGB = mix(mixed.rgb, borderRGB, borderMask);

    float alpha = mixed.a * uOpacity;
    alpha = max(alpha, borderMask * uOpacity * 0.9);

    gl_FragColor = vec4(finalRGB, alpha);
  }
`;

/* =========================================================
   THREE.JS SETUP
========================================================= */
const canvas = document.getElementById('webgl');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050507);
scene.fog = new THREE.Fog(0x050507, 800, 2000);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  3000
);
camera.position.set(0, 0, HERO.cameraStart);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x050507);

/* Lights */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(8, 14, 12);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x22d3ee, 0.6);
rimLight.position.set(-12, -6, -8);
scene.add(rimLight);

/* =========================================================
   PROCEDURAL TEXTURES
========================================================= */
function makeTexture(hue, label) {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 576;
  const ctx = c.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 1024, 576);
  grad.addColorStop(0, `hsl(${hue}, 65%, 45%)`);
  grad.addColorStop(1, `hsl(${(hue + 40) % 360}, 75%, 12%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 576);

  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 1024; i += 96) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 576); ctx.stroke();
  }
  for (let i = 0; i < 576; i += 96) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
  }

  // subtle grain
  const img = ctx.getImageData(0, 0, 1024, 576);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 12;
    img.data[i] += n;
    img.data[i + 1] += n;
    img.data[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 72px Montserrat, sans-serif';
  ctx.fillText(label, 40, 520);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const textures = Array.from({ length: 6 }, (_, i) =>
  makeTexture(180 + i * 45, `PANEL-0${i + 1}`)
);

/* =========================================================
   PANEL GENERATION
========================================================= */
const panels = [];
let panelId = 0;

for (let layerIndex = 0; layerIndex < HERO.layers.length; layerIndex++) {
  const z = HERO.layers[layerIndex];
  const count = HERO.panelsPerLayer[layerIndex];
  const spread = 22 + layerIndex * 4;

  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const x = (t - 0.5) * spread;
    const y = (layerIndex % 2 === 0 ? 1 : -1) * (i % 2 === 0 ? 2.5 : -2.5);
    const rotationY = (t - 0.5) * 0.25;
    const rotationZ = (Math.random() - 0.5) * 0.05;

    const column = x < -3 ? 'left' : x > 3 ? 'right' : 'center';
    const scale = layerIndex === 0 ? 1.0 : 0.9;

    const geo = new THREE.PlaneGeometry(HERO.panelW, HERO.panelH, 1, 1);
    const texA = textures[panelId % 6];
    const texB = textures[(panelId + 3) % 6];

    const uniforms = {
      uTexA: { value: texA },
      uTexB: { value: texB },
      uProgress: { value: 0 },
      uAberration: { value: 0.005 },
      uOpacity: { value: 0 },
      uTime: { value: 0 },
      uDepth: { value: z },
      uBorderWidth: { value: 0.012 },
      uBorderColor: { value: new THREE.Color(0xffffff) },
      uResolution: { value: new THREE.Vector2(1024, 576) },
    };

    const mat = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      transparent: true,
      side: THREE.DoubleSide,
      uniforms,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.rotation.set(0, rotationY, rotationZ);
    mesh.scale.setScalar(scale);

    mesh.userData = {
      baseX: x,
      baseY: y,
      baseZ: z,
      column,
      layerIndex,
      panelIndex: panelId,
      uniforms,
    };

    scene.add(mesh);
    panels.push(mesh);
    panelId++;
  }
}

/* =========================================================
   ATMOSPHERE — dust + dot grid
========================================================= */
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(800 * 3);
for (let i = 0; i < 800 * 3; i += 3) {
  dustPos[i] = rand(-40, 40);
  dustPos[i + 1] = rand(-20, 20);
  dustPos[i + 2] = rand(-650, 50);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(
  dustGeo,
  new THREE.PointsMaterial({
    color: 0x88eaff,
    size: 1.5,
    transparent: true,
    opacity: 0.5,
    sizeAttenuation: true,
  })
);
scene.add(dust);

const dotGeo = new THREE.BufferGeometry();
const dp = [];
for (let x = -40; x <= 40; x += 3)
  for (let y = -20; y <= 20; y += 3)
    dp.push(x, y, -650);
dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
const dotGrid = new THREE.Points(
  dotGeo,
  new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.6,
    transparent: true,
    opacity: 0.15,
    sizeAttenuation: true,
  })
);
scene.add(dotGrid);

/* =========================================================
   TITLE SPLIT
========================================================= */
const headlineEl = document.getElementById('headline');
const subtitleEl = document.getElementById('subtitle');
const titleWrapEl = document.getElementById('title-wrap');

function buildHeadline(lines) {
  const lineEls = headlineEl.querySelectorAll('.line');
  lineEls.forEach((lineEl, i) => {
    lineEl.innerHTML = '';
    const text = lines[i] || '';
    [...text].forEach((ch) => {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      lineEl.appendChild(span);
    });
  });
}

function buildSubtitle(text) {
  subtitleEl.innerHTML = '';
  [...text].forEach((ch) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    subtitleEl.appendChild(span);
  });
}

buildHeadline(HERO.titleLines);
buildSubtitle(HERO.subtitle);

/* Tick rails */
const ticksTop = document.getElementById('ticks-top');
const ticksBottom = document.getElementById('ticks-bottom');
for (let i = 0; i < 40; i++) {
  const t1 = document.createElement('div');
  t1.className = 'tick';
  ticksTop.appendChild(t1);
  const t2 = document.createElement('div');
  t2.className = 'tick';
  ticksBottom.appendChild(t2);
}

/* =========================================================
   HUD LIVE READOUTS
========================================================= */
const fpsEl = document.getElementById('fps-readout');
const zEl = document.getElementById('z-readout');
const rollEl = document.getElementById('roll-readout');
const frameEl = document.getElementById('frame-readout');

function pad(n, len = 2) {
  return String(Math.floor(n)).padStart(len, '0');
}

/* =========================================================
   CAMERA STATE (proxy — GSAP mutates, RAF reads)
========================================================= */
const camState = {
  x: 0,
  y: 0,
  z: HERO.cameraStart,
  rotX: 0,
  rotY: 0,
  rotZ: 0,
};

/* =========================================================
   RENDER LOOP
========================================================= */
const clock = new THREE.Clock();
let fpsFrames = 0;
let fpsLast = 0;
let elapsed = 0;
let rafId = 0;

function tick() {
  rafId = requestAnimationFrame(tick);
  elapsed = clock.getElapsedTime();

  /* Camera */
  camera.position.set(camState.x, camState.y, camState.z);
  camera.rotation.x = camState.rotX;
  camera.rotation.y = camState.rotY;
  camera.rotation.z = camState.rotZ;

  /* Panels idle + shader time */
  for (let i = 0; i < panels.length; i++) {
    const p = panels[i];
    const u = p.userData.uniforms;
    u.uTime.value = elapsed;
    p.rotation.z = Math.sin(elapsed * 0.4 + i) * 0.008;
  }

  dust.rotation.z = elapsed * 0.01;
  dotGrid.rotation.z = elapsed * 0.003;

  /* Readouts */
  fpsFrames++;
  if (elapsed - fpsLast > 0.5) {
    fpsEl.textContent = String(Math.round(fpsFrames / (elapsed - fpsLast)));
    fpsFrames = 0;
    fpsLast = elapsed;
  }
  if (zEl) zEl.textContent = camState.z.toFixed(2);
  if (rollEl) rollEl.textContent = (camState.rotZ * 180 / Math.PI).toFixed(2) + '°';
  if (frameEl) {
    const totalFrames = Math.floor(elapsed * 30);
    const ff = totalFrames % 30;
    const ss = Math.floor(totalFrames / 30) % 60;
    const mm = Math.floor(totalFrames / 1800) % 60;
    const hh = Math.floor(totalFrames / 108000);
    frameEl.textContent = `${pad(hh)}:${pad(mm)}:${pad(ss)}:${pad(ff)}`;
  }

  renderer.render(scene, camera);
}

/* =========================================================
   GSAP MASTER TIMELINE
========================================================= */
let masterTl = null;

function buildTimeline() {
  if (masterTl) masterTl.kill();

  /* Reset camera */
  Object.assign(camState, {
    x: 0, y: 0, z: HERO.cameraStart,
    rotX: 0, rotY: 0, rotZ: 0,
  });

  /* Reset panels */
  panels.forEach((p) => {
    const d = p.userData;
    p.position.set(d.baseX, d.baseY, d.baseZ);
    p.scale.setScalar(d.layerIndex === 0 ? 1.0 : 0.9);
    p.rotation.set(0, (d.baseX / 44) * 0.25, 0);
    d.uniforms.uProgress.value = 0;
    d.uniforms.uAberration.value = 0.005;
    d.uniforms.uOpacity.value = 0;
  });

  /* Reset HUD */
  gsap.set('.svg-frame path', { strokeDashoffset: 2000 });
  gsap.set('.svg-frame', { opacity: 0 });
  gsap.set('.bracket', { opacity: 0 });
  gsap.set('.grid-overlay', { opacity: 0 });
  gsap.set('.tick-rail', { opacity: 0 });
  gsap.set('.coord', { opacity: 0 });
  gsap.set('.crosshair', { opacity: 0 });
  gsap.set('.hud', { opacity: 1 });
  gsap.set('.title-wrap', { scale: 1 });

  /* Reset text */
  const chars = headlineEl.querySelectorAll('.char');
  gsap.set(chars, { y: '100%', opacity: 0 });
  gsap.set(subtitleEl, { letterSpacing: '0.05em' });
  gsap.set(subtitleEl.querySelectorAll('.char'), { opacity: 0 });

  const tl = gsap.timeline({ paused: true });
  masterTl = tl;

  /* ================= PHASE 1: Grid Draw & Focus (0.0 – 1.2s) ================= */
  tl.to('.svg-frame', { opacity: 1, duration: 0.1 }, 0.0);
  tl.to('.svg-frame path', {
    strokeDashoffset: 0,
    duration: 0.8,
    ease: 'power3.out',
    stagger: 0.08,
  }, 0.0);

  tl.to('.bracket', { opacity: 1, duration: 0.6, stagger: 0.06 }, 0.05);
  tl.to('.grid-overlay', { opacity: 1, duration: 0.7 }, 0.1);
  tl.to('.tick-rail', { opacity: 1, duration: 0.6, stagger: 0.1 }, 0.15);
  tl.to('.coord', { opacity: 1, duration: 0.5, stagger: 0.08 }, 0.2);
  tl.to('.crosshair', { opacity: 1, duration: 0.4 }, 0.25);

  // 0.2s — camera dolly Z 1000 → 700
  tl.to(camState, {
    z: HERO.cameraMid,
    duration: 1.0,
    ease: 'power2.out',
  }, 0.2);

  // 0.4s — panels fade in + central scale 0.8→1.0
  panels.forEach((p, i) => {
    const d = p.userData;
    const targetScale = d.layerIndex === 0 ? 1.0 : 0.9;
    tl.to(d.uniforms.uOpacity, {
      value: 1,
      duration: 0.8,
      ease: 'power2.out',
    }, 0.4 + i * 0.03);
    tl.fromTo(p.scale, {
      x: targetScale * 0.8,
      y: targetScale * 0.8,
    }, {
      x: targetScale,
      y: targetScale,
      duration: 0.9,
      ease: 'power2.out',
    }, 0.4 + i * 0.02);
  });

  // 0.6s — headline chars stagger up
  tl.to(chars, {
    y: '0%',
    opacity: 1,
    duration: 0.7,
    ease: 'power3.out',
    stagger: 0.03,
  }, 0.6);

  /* ================= PHASE 2: Split-Panel Parallax (1.2 – 3.2s) ================= */
  // 1.2s — camera pitch/yaw tilt
  tl.to(camState, {
    rotX: -0.05,
    rotY: 0.08,
    duration: 1.0,
    ease: 'power2.inOut',
  }, 1.2);

  // 1.4s — split masks: left panels → left, right → right
  panels.forEach((p) => {
    const d = p.userData;
    const offset = d.column === 'left' ? -4.0 : d.column === 'right' ? 4.0 : 0;
    tl.to(p.position, {
      x: d.baseX + offset,
      duration: 1.6,
      ease: 'power2.inOut',
    }, 1.4);
  });

  // 1.6s — texture crossfade via shader uProgress
  panels.forEach((p, i) => {
    tl.to(p.userData.uniforms.uProgress, {
      value: 1,
      duration: 1.0,
      ease: 'power2.inOut',
    }, 1.6 + i * 0.03);
  });

  // 2.0s — subtitle enters, letter-spacing expands
  tl.to(subtitleEl.querySelectorAll('.char'), {
    opacity: 1,
    duration: 0.6,
    stagger: 0.015,
    ease: 'power2.out',
  }, 2.0);
  tl.to(subtitleEl, {
    letterSpacing: '0.2em',
    duration: 1.2,
    ease: 'power2.inOut',
  }, 2.0);
  tl.to(subtitleEl, { opacity: 1, duration: 0.3 }, 2.0);

  /* ================= PHASE 3: Climax Zoom & Outro (3.2 – 5.0s) ================= */
  // 3.2s — fast dolly zoom 700 → 200
  tl.to(camState, {
    z: HERO.cameraEnd,
    duration: 1.2,
    ease: 'expo.inOut',
  }, 3.2);

  // 3.5s — chromatic aberration spike 0.02 → 0
  panels.forEach((p) => {
    const u = p.userData.uniforms;
    tl.to(u.uAberration, {
      value: 0.02,
      duration: 0.2,
      ease: 'power4.out',
    }, 3.5);
    tl.to(u.uAberration, {
      value: 0,
      duration: 0.8,
      ease: 'power2.in',
    }, 3.7);
  });

  // 3.6s — camera tilt unwinds
  tl.to(camState, {
    rotX: 0,
    rotY: 0,
    duration: 1.2,
    ease: 'power2.inOut',
  }, 3.6);

  // 4.0s — panels drift back
  panels.forEach((p) => {
    tl.to(p.position, {
      x: p.userData.baseX,
      duration: 0.9,
      ease: 'power2.out',
    }, 4.0);
  });

  // 4.0s — headline scales down slightly
  tl.to(titleWrapEl, {
    scale: 0.92,
    duration: 1.0,
    ease: 'power2.inOut',
  }, 4.0);

  // 4.5s — HUD dims to 0.4
  tl.to('#hud', {
    opacity: 0.4,
    duration: 0.5,
    ease: 'power2.out',
  }, 4.5);

  return tl;
}

/* =========================================================
   RESIZE
========================================================= */
let resizeRaf = 0;
function onResize() {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    panels.forEach((p) => {
      p.userData.uniforms.uResolution.value.set(w, h);
    });
  });
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

/* =========================================================
   VISIBILITY PAUSE
========================================================= */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(rafId);
    if (masterTl) masterTl.pause();
  } else {
    clock.getDelta();
    tick();
    if (masterTl) masterTl.play();
  }
});

/* =========================================================
   BOOT
========================================================= */
function boot() {
  onResize();
  tick();

  const tl = buildTimeline();

  const loader = document.getElementById('loader');
  setTimeout(() => {
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 700);
  }, 200);

  setTimeout(() => {
    tl.play(0);
  }, 400);
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(boot);
} else {
  window.addEventListener('load', boot);
}

/* =========================================================
   PUBLIC API
========================================================= */
window.HeroEngine = {
  replay() {
    const tl = buildTimeline();
    tl.play(0);
  },
  setHeadline(lines) {
    HERO.titleLines = lines;
    buildHeadline(lines);
    const tl = buildTimeline();
    tl.play(0);
  },
  setSubtitle(text) {
    HERO.subtitle = text;
    buildSubtitle(text);
    subtitleEl.setAttribute('aria-label', text);
  },
  destroy() {
    cancelAnimationFrame(rafId);
    if (masterTl) masterTl.kill();
    panels.forEach((p) => {
      p.geometry.dispose();
      p.material.dispose();
    });
    dustGeo.dispose();
    dotGeo.dispose();
    renderer.dispose();
  },
};
</script>
