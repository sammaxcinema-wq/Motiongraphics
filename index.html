<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro 3D Motion Graphics Engine (1080p Export)</title>
    
    <!-- GSAP for Timeline Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Three.js for WebGL 3D Depth & Glass -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- CCapture & Whammy for Video Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ccapture.js/1.1.0/CCapture.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/whammy/1.3.0/whammy.min.js"></script>

    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --accent: #FFCC00;
            --text: #ffffff;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- UI SIDEBAR --- */
        #sidebar {
            width: 320px;
            background: var(--panel);
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        h2 { margin-top: 0; font-size: 18px; color: var(--accent); }
        h3 { font-size: 12px; margin: 10px 0 5px 0; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        
        label { font-size: 13px; display: block; margin-bottom: 4px; }
        input[type="text"], input[type="color"], select {
            width: 100%; padding: 8px; background: #000; border: 1px solid #333;
            color: white; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px;
        }
        
        button {
            background: var(--accent); color: #000; border: none; padding: 12px;
            font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px;
        }
        button:disabled { background: #555; cursor: not-allowed; }

        /* --- PREVIEW AREA --- */
        #preview-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background: #000; overflow: hidden; position: relative;
        }

        /* Wrapper for scaling 1920x1080 down to fit screen */
        #canvas-wrapper {
            width: 1920px; height: 1080px; position: absolute;
            transform-origin: center center;
        }

        /* The actual 1920x1080 Render Canvas */
        #app-canvas {
            width: 1920px; height: 1080px; background-color: #f4f4f4;
            position: relative; overflow: hidden; perspective: 1500px;
        }

        /* WebGL Canvas (3D Background & Glass) */
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        /* 2D Overlay Elements */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* Typography */
        #main-text-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-3deg);
            z-index: 20; text-align: center;
        }
        #main-text {
            font-size: 150px; font-weight: 900; color: #111; text-transform: uppercase;
            letter-spacing: -4px; white-space: nowrap; text-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Angular Ribbons */
        .ribbon {
            position: absolute; background: var(--accent); transform: rotate(-5deg);
            z-index: 5; height: 120px; top: 40%; left: -10%;
        }

        /* HUD Elements */
        .hud-crosshair {
            position: absolute; width: 60px; height: 60px; border: 2px solid #111;
            border-radius: 50%; opacity: 0; z-index: 15;
        }
        .hud-crosshair::before, .hud-crosshair::after { content: ''; position: absolute; background: #111; }
        .hud-crosshair::before { width: 2px; height: 140%; left: 50%; top: -20%; }
        .hud-crosshair::after { height: 2px; width: 140%; top: 50%; left: -20%; }
        
        .hud-data {
            position: absolute; font-family: monospace; font-size: 18px; color: #111;
            z-index: 15; opacity: 0; border-left: 3px solid var(--accent); padding-left: 10px;
        }
        
        /* Scrolling Data Container */
        #data-stream {
            position: absolute; right: 10%; top: 20%; width: 200px; height: 400px;
            overflow: hidden; font-family: monospace; font-size: 14px; color: #111;
            z-index: 15; opacity: 0; mask-image: linear-gradient(to bottom, transparent, black, transparent);
        }
        .data-line { margin-bottom: 5px; }

        /* Lens Flare */
        .lens-flare {
            position: absolute; width: 600px; height: 200px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.9) 0%, rgba(255,204,0,0.4) 30%, rgba(255,255,255,0) 70%);
            transform: rotate(-20deg); z-index: 25; mix-blend-mode: screen; opacity: 0;
        }

        /* Recording UI */
        #recording-overlay {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9); color: white; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; display: none; z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <h2>3D Motion Engine</h2>
        
        <h3>Text Details</h3>
        <input type="text" id="input-text" value="MAXING & TRANSACTIONS">

        <h3>Brand Colors</h3>
        <label>Accent Color</label>
        <input type="color" id="input-color-accent" value="#FFCC00">
        <label>Text Color</label>
        <input type="color" id="input-color-text" value="#111111">

        <h3>Animation Speed</h3>
        <select id="input-speed">
            <option value="1">Normal (1x)</option>
            <option value="1.5">Fast (1.5x)</option>
            <option value="0.5">Slow (0.5x)</option>
        </select>

        <button id="btn-preview">▶ Play 3D Preview</button>
        <button id="btn-export">⬇ Export 4K Quality Video</button>
    </div>

    <!-- PREVIEW & RENDER AREA -->
    <div id="preview-container">
        <div id="canvas-wrapper">
            <div id="app-canvas">
                <!-- 3D WebGL Layer -->
                <canvas id="webgl-canvas" width="1920" height="1080"></canvas>
                
                <!-- 2D Motion Layer -->
                <div class="ui-layer">
                    <div class="ribbon" id="ribbon-1"></div>
                    
                    <div class="hud-crosshair" style="top: 20%; left: 15%;" id="hud-1"></div>
                    <div class="hud-crosshair" style="bottom: 25%; right: 20%;" id="hud-2"></div>
                    
                    <div class="hud-data" style="top: 25%; right: 10%;" id="hud-data-1">SYS.STATUS: ONLINE</div>
                    <div class="hud-data" style="bottom: 15%; left: 10%;" id="hud-data-2">LAT: 40.7128° N</div>
                    
                    <div id="data-stream"></div>

                    <div id="main-text-container">
                        <div id="main-text">MAXING & TRANSACTIONS</div>
                    </div>

                    <div class="lens-flare" id="flare"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="recording-overlay">🔴 RENDERING 60FPS VIDEO...</div>

    <script>
        // --- 1. DYNAMIC SCALING ---
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            const container = document.getElementById('preview-container');
            const scale = Math.min(container.clientWidth / 1920, container.clientHeight / 1080) * 0.95;
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- 2. THREE.JS SETUP (3D Depth & Glass Panels) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f4f4); // Match canvas bg
        
        const camera = new THREE.PerspectiveCamera(45, 1920 / 1080, 0.1, 1000);
        camera.position.set(0, 0, 20);

        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.getElementById('webgl-canvas'), 
            alpha: true, 
            antialias: true 
        });
        renderer.setSize(1920, 1080);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Lighting for Glass
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Create Floating Glass Panels (Multi-plane Parallax)
        const glassPanels = [];
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.1,
            roughness: 0.1,
            transmission: 0.9, // Glass effect
            transparent: true,
            opacity: 0.3,
            ior: 1.5,
            thickness: 0.5,
            side: THREE.DoubleSide
        });

        // Panel 1 (Left)
        const geo1 = new THREE.PlaneGeometry(8, 5);
        const mesh1 = new THREE.Mesh(geo1, glassMaterial);
        mesh1.position.set(-12, 5, -5);
        mesh1.rotation.set(0.2, 0.4, 0.1);
        scene.add(mesh1);
        glassPanels.push(mesh1);

        // Panel 2 (Right)
        const geo2 = new THREE.PlaneGeometry(10, 6);
        const mesh2 = new THREE.Mesh(geo2, glassMaterial);
        mesh2.position.set(15, -6, -2);
        mesh2.rotation.set(-0.1, -0.4, -0.1);
        scene.add(mesh2);
        glassPanels.push(mesh2);

        // Panel 3 (Center Foreground - Split Screen effect)
        const geo3 = new THREE.PlaneGeometry(6, 3);
        const mesh3 = new THREE.Mesh(geo3, glassMaterial);
        mesh3.position.set(0, 12, 5);
        mesh3.rotation.set(0, 0, 0);
        scene.add(mesh3);
        glassPanels.push(mesh3);

        // Create Dot Matrix Grid in 3D
        const dotGeo = new THREE.BufferGeometry();
        const dotPositions = [];
        for(let x = -15; x <= 15; x+=2) {
            for(let y = -10; y <= 10; y+=2) {
                dotPositions.push(x, y, -10); // Push to back plane
            }
        }
        dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dotPositions, 3));
        const dotMat = new THREE.PointsMaterial({ color: 0x111111, size: 0.15 });
        const dotGrid = new THREE.Points(dotGeo, dotMat);
        scene.add(dotGrid);

        // Animation Loop for WebGL
        const clock = new THREE.Clock();
        function animateWebGL() {
            requestAnimationFrame(animateWebGL);
            const time = clock.getElapsedTime();
            
            // Subtle continuous floating effect
            mesh1.position.y = 5 + Math.sin(time * 0.5) * 0.5;
            mesh2.position.y = -6 + Math.cos(time * 0.6) * 0.5;
            mesh3.position.y = 12 + Math.sin(time * 0.8) * 0.3;

            renderer.render(scene, camera);
        }
        animateWebGL();

        // --- 3. POPULATE DATA STREAM ---
        const dataStream = document.getElementById('data-stream');
        for(let i=0; i<20; i++) {
            const line = document.createElement('div');
            line.className = 'data-line';
            line.innerText = `DATA_0x${Math.floor(Math.random()*9999)} :: ${Math.random().toString(36).substring(7).toUpperCase()}`;
            dataStream.appendChild(line);
        }

        // --- 4. UI EVENT LISTENERS ---
        const mainTextElement = document.getElementById('main-text');
        document.getElementById('input-text').addEventListener('input', (e) => mainTextElement.innerText = e.target.value);
        
        document.getElementById('input-color-accent').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--accent', e.target.value);
            document.querySelectorAll('.ribbon').forEach(el => el.style.background = e.target.value);
            // Note: Changing 3D material color dynamically requires updating the Three.js material
        });

        document.getElementById('input-color-text').addEventListener('input', (e) => {
            mainTextElement.style.color = e.target.value;
            document.querySelectorAll('.hud-crosshair').forEach(el => el.style.borderColor = e.target.value);
            document.querySelectorAll('.hud-data').forEach(el => el.style.color = e.target.value);
        });

        // --- 5. THE MASTER 3D PARALLAX TIMELINE ---
        let masterTl;

        function buildTimeline() {
            // Reset All Elements
            gsap.set("#main-text", { scale: 0.5, opacity: 0, rotationX: 30 });
            gsap.set(".ribbon", { width: 0, opacity: 0, rotationZ: -15 });
            gsap.set("#hud-1, #hud-2", { opacity: 0, scale: 0 });
            gsap.set("#hud-data-1, #hud-data-2", { opacity: 0, x: -20 });
            gsap.set("#data-stream", { opacity: 0, y: 50 });
            gsap.set("#flare", { left: "-30%", opacity: 0, scale: 0.8 });
            
            // Reset 3D Panels (Slide them off screen)
            glassPanels[0].position.x = -40;
            glassPanels[1].position.x = 40;
            glassPanels[2].position.y = 40;

            const speed = parseFloat(document.getElementById('input-speed').value) || 1;

            masterTl = gsap.timeline({ 
                paused: true, 
                defaults: { ease: "expo.out", duration: 1.2 / speed } 
            });

            // 1. Camera Sweep & Ribbons
            masterTl.to(".ribbon", { width: "130%", opacity: 1, rotationZ: -5, duration: 1 / speed }, 0)
            
            // 2. 3D Glass Panels Sweep In (Spatial Parallax)
                .to(glassPanels[0].position, { x: -15, duration: 1.5 / speed, ease: "power3.out" }, 0.2)
                .to(glassPanels[1].position, { x: 15, duration: 1.5 / speed, ease: "power3.out" }, 0.3)
                .to(glassPanels[2].position, { y: 12, duration: 1.5 / speed, ease: "power3.out" }, 0.1)

            // 3. Typography Snap (3D Rotation to flat)
                .to("#main-text", { scale: 1, opacity: 1, rotationX: 0, duration: 1.5 / speed }, 0.3)
            
            // 4. HUD Elements pop in
                .to("#hud-1, #hud-2", { opacity: 1, scale: 1, duration: 0.6 / speed, stagger: 0.2 / speed }, 0.6)
                .to("#hud-data-1, #hud-data-2", { opacity: 1, x: 0, duration: 0.6 / speed, stagger: 0.1 / speed }, 0.8)
            
            // 5. Data Stream Scrolling (Simulated wipe)
                .to("#data-stream", { opacity: 1, y: 0, duration: 0.5 / speed }, 1)
                .fromTo(".data-line", { y: 50 }, { y: -100, duration: 2 / speed, ease: "none", stagger: 0.05 }, 1)

            // 6. Cinematic Lens Flare Sweep
                .to("#flare", { left: "130%", opacity: 1, scale: 1, duration: 2 / speed, ease: "power2.inOut" }, 0.5)
                .to("#flare", { opacity: 0, duration: 0.5 / speed }, 2.5);
                
            // Camera Slight Zoom/Dolly effect
            masterTl.fromTo(camera.position, { z: 25 }, { z: 20, duration: 3 / speed, ease: "power2.out" }, 0);
        }

        buildTimeline();
        document.getElementById('btn-preview').addEventListener('click', () => { buildTimeline(); masterTl.play(); });
        document.getElementById('input-speed').addEventListener('change', buildTimeline);

        // --- 6. 1080P VIDEO EXPORT ENGINE ---
        document.getElementById('btn-export').addEventListener('click', function() {
            const exportBtn = this;
            const overlay = document.getElementById('recording-overlay');
            const appCanvas = document.getElementById('app-canvas');
            const webglCanvas = document.getElementById('webgl-canvas');

            exportBtn.disabled = true;
            overlay.style.display = 'block';
            buildTimeline();

            // Important: CCapture captures the DOM. Because WebGL draws directly to canvas,
            // we have to record the visual output. CCapture handles canvas merging well.
            
            const capturer = new CCapture({
                format: 'webm',
                framerate: 60, // 60 FPS
                verbose: true,
                quality: 1.0,
                display: false
            });

            setTimeout(() => {
                capturer.start();
                masterTl.play();

                function captureFrame() {
                    if (masterTl.progress() < 1) {
                        // Capture the composite of both DOM and WebGL
                        capturer.capture(appCanvas); 
                        requestAnimationFrame(captureFrame);
                    } else {
                        capturer.stop();
                        capturer.save(function(blob) {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.style.display = 'none';
                            a.href = url;
                            a.download = '3D_Corporate_Intro_60fps.webm';
                            document.body.appendChild(a);
                            a.click();
                            window.URL.revokeObjectURL(url);
                            exportBtn.disabled = false;
                            overlay.style.display = 'none';
                        });
                    }
                }
                requestAnimationFrame(captureFrame);
            }, 1000); 
        });
    </script>
</body>
</html>
